:"https://chrockey.github.io/PointWAM/","kind":"연구 프로젝트","note":"3D 장면·손 궤적 공동 예측; 자체 벤치마크와 실제 실험 구분"},"pose6d":{"date":"2026.10","title":"Pose6DAug — 객체 치환 데이터 증강","url":"https://arxiv.org/abs/2606.20118","kind":"연구 논문","note":"다중뷰 일관성을 유지한 3D 증강"},"rofacto":{"date":"2026.07","title":"RoFacto — 로봇 렌더링 월드모델","url":"https://arxiv.org/abs/2607.22535","kind":"연구 논문","note":"로봇 기구학과 장면 반응을 분리"},"vpm":{"date":"2026.11","title":"VPM — 4D 포인트 궤적 예측","url":"https://arxiv.org/abs/2610.28594","kind":"연구 논문","note":"다중뷰 영상과 포인트 궤적 결합"}},"lessons":[{"id":"vision","title":"01 · 류중희의 사고방식","icon":"🧭","desc":"대표의 직접 발언에서 사업 가설을 뽑는 법","cards":[{"title":"왜 직접 RFM을 만드나","one":"기반 모델을 소유하지 않으면 응용 서비스가 상위 모델에 흡수될 위험이 있다는 것이 류 대표의 출발점이다.","deep":"<p><strong>2026년 더벨 인터뷰<\/strong>에서 그는 파운데이션 모델을 보유하지 않은 회사의 기술이 상위 모델에 흡수될 가능성을 언급했다. 이는 로봇 분야에서 남의 API를 단순 조합하는 회사를 넘어, 다른 회사가 사용하는 핵심 지능 공급자가 되려는 선택으로 읽힌다.<\/p><p><strong>2025년 바이라인 인터뷰<\/strong>에서는 다른 로봇 제작사가 필요에 따라 리얼월드의 API를 선택하는 그림을 직접 언급했다. 본인들의 모델을 쓰지 않아도 잘 작동하는 산업 분야가 있음을 인정했다.<\/p>","limit":"모델 소유가 곧 독점력은 아니다. 동등한 공개모델, 고객의 자체 정책, 하드웨어 제조사의 수직 통합이 가능한 대안이다.","apply":"“독자 모델을 만드는 이유는 모델 자체 판매가 아니라, 어려운 산업 작업에서 지능의 재사용성을 확보하기 위해서라고 이해했습니다.”","refs":["bell26","by25"],"terms":["RFM","API","Switching Cost"]},{"title":"모델 회사인가, 팔란티어인가","one":"범용 RFM 공급자이면서 동시에 산업 현장의 문제를 정의·데이터화하는 기업을 지향한다.","deep":"<p>류 대표는 리얼월드를 <strong>피지컬 AI의 팔란티어<\/strong>에 비유했다. 기업이 수년간 쌓아온 숙련 작업을 분석하고 데이터 자산으로 변환하여 산업별 모델로 이어간다는 것이다. 현장에서는 단순한 모델 endpoint보다 작업 해체, 성공 기준 정의, 데이터 권리, 반복 운영이 고객 가치를 만든다.<\/p><p>그래서 API와 RX(현장 작업 분석)·RD(배포)는 모순이 아니다. 초기에는 현장 투입 비용이 높더라도 그 경험을 공통 모델에 재사용하면 장기에는 플랫폼 경제성을 얻는다는 가설이다.<\/p>","limit":"고객사마다 모든 부분이 새로 만들어진다면 컨설팅·SI형 사업이 되고 소프트웨어 레버리지는 줄어든다.","apply":"“고객 1곳에서 얻은 지식이 다음 현장에 얼마나 재사용되는지를 사업의 핵심 지표로 볼 것 같습니다.”","refs":["bell26","aws","datajob"],"terms":["RX","RD","Data Flywheel"]},{"title":"Deploy First","one":"연구실에서 완벽한 범용 모델을 기다리기보다 현장 작업을 먼저 해결하고, 배포를 통해 배워야 한다는 실행 철학이다.","deep":"<p>2026년 8월 인터뷰의 핵심 표현이 <strong>Deploy First<\/strong>다. 현장 목표 작업을 정하고 파인튜닝·실증을 진행하여 실제 코너 케이스를 만나는 것이 데이터 플라이휠의 시작이다.<\/p><p>로봇은 오프라인 벤치마크 성공률이 높아도 조명·컨베이어 속도·마찰·작업자와의 동선이 바뀌면 성능이 무너질 수 있다. 따라서 데이터 파이프라인의 중요한 목표는 단순 처리량뿐 아니라 <strong>실패 발견 → 재수집 → 정제 → 재학습 → 재검증<\/strong>의 지연 시간을 줄이는 것이다.<\/p>","limit":"Deploy First는 안전하지 않은 모델을 무조건 투입한다는 뜻이 아니다. 감독, 안전장치, 작은 범위의 통제된 실증이 필요하다.","apply":"“제가 줄이고 싶은 시간은 데이터 처리 시간만이 아니라, 현장 실패가 다음 학습 실험에 반영되기까지의 전체 시간입니다.”","refs":["dn26","aws"],"terms":["Deploy First","Corner Case","Active Learning"]},{"title":"엔지니어링 효율에 대한 철학","one":"자본과 GPU 물량 경쟁만이 정답은 아니며, 실시간성·엣지 제약·데이터 효율을 해결하는 엔지니어링을 중시한다.","deep":"<p>2025년 바이라인 인터뷰에서 류 대표는 대형 하드웨어 회사와 달리 자신들은 소프트웨어 중심이며 비용 효율성을 추구한다고 설명했다. 모델을 엣지에서도 실행하고 로봇 제어의 빠른 응답성을 확보해야 한다는 점을 지적했다.<\/p><p>이 관점에서는 모델 정확도뿐 아니라 데이터 생성 비용, 학습 파이프라인 throughput, GPU idle time, 엔드투엔드 배포 기간까지 모두 중요한 기술 과제다.<\/p>","limit":"연산 비용이 중요하지 않다는 뜻은 아니다. 실제로 AWS 기술 사례는 H200, 고속 스토리지 등 상당한 컴퓨팅 자원을 사용한다고 설명한다.","apply":"“큰 자원을 쓰는 것 자체보다, 품질과 학습 효과를 같은 비용 안에서 더 많이 얻는 방법을 고민하겠습니다.”","refs":["by25","aws"],"terms":["Edge Inference","Throughput","Latency"]},{"title":"대표 개인의 동기와 조직문화","one":"한국 엔지니어가 세계적인 성과를 내고 기술의 경제적 과실을 얻는 사례를 만들고 싶다고 반복해서 말했다.","deep":"<p>인터뷰에서 류 대표는 엔지니어들이 세계적으로 경쟁할 수 있음을 증명하고 싶다는 동기를 밝혔다. 공식 채용 페이지는 <strong>Bottom-up, AI-Native, 개인 판단과 몰입 존중<\/strong>을 강조한다.<\/p><p>면접에서 중요한 것은 그 표현을 따라 말하는 게 아니다. 스스로 병목을 정의하고, 반례를 검증하고, 실패에 대한 책임을 어떻게 다뤘는지 구체적인 경험으로 설명하는 것이다.<\/p>","limit":"공식 조직 문화 문구를 실제 면접 평가표라고 가정할 수는 없다. 류 대표의 개인적 기대를 확정할 근거는 없다.","apply":"“무엇을 시키는지보다 왜 문제가 발생하는지 먼저 정의하고, 실험으로 개선할 수 있는 엔지니어로 기여하고 싶습니다.”","refs":["by25","career","bell26"],"terms":["Bottom-up","Ownership"]},{"title":"문샷에서 역산하는 사고방식","one":"대표는 지금 가진 자원의 한계로 목표를 정하지 않고, 10~20년 뒤의 큰 목표를 먼저 설정하고 필요한 자원을 역산해야 한다고 설명했다.","deep":"<p><strong>2025년 5월 바이라인 인터뷰 ①<\/strong>에서 류 대표는 대형 목표를 먼저 정하고 이를 실현할 팀·연구 자원·자금을 역산하는 사고를 강조했다. 실제로 교수 30명 이상을 만나며 연구팀을 결집하고 RFM을 위한 자원을 확보했다고 설명했다.<\/p><p>Hand Data Pipeline에 적용하면 “처리 코드를 최적화해 보자”가 아니라 “다양한 로봇 손에 1주 안에 적용하려면 데이터 구조와 검증 시스템을 어떻게 바꿔야 하나?”를 목표로 놓고 역산하는 문제 정의다. 세부 실행 가능성과 단계적 검증은 함께 필요하다.<\/p>","limit":"문샷만 내세운다고 기술이 실현되는 것은 아니다. 안전·비용·실험 증거를 갖춘 단계별 계획이 필요하며 대표의 발언을 채용 평가기준이라고 단정할 수 없다.","apply":"“최종적으로 줄여야 할 비용이나 시간을 먼저 정의하고, 그 목표에서 역으로 우선순위와 실험 지표를 세우는 방식을 선호합니다.”","refs":["by25a"],"terms":["Moonshot Thinking","Backward Planning"]},{"title":"정답 없는 데이터 수집 문제, 무한 시행착오는 안 된다","one":"류 대표는 피지컬 AI 데이터에는 아직 확립된 골든룰이 없지만 무한한 시행착오를 할 수도 없다고 명확히 말했다.","deep":"<p>같은 인터뷰에서 그는 로봇 학습 데이터의 수집 방식이 아직 정해지지 않았고, 경영자로서는 자원을 어디에 투입해 몇 번의 시행착오로 답을 얻을지 결정해야 한다고 강조했다. <strong>핵심은 불확실성을 줄이는 실험 설계<\/strong>다.<\/p><p>예를 들어 사람 영상 기반 복원, 텔레오퍼레이션, 시뮬레이션 세 가지 중 어느 쪽이 더 좋은지 결론부터 정하기보다 ① 고정된 작업 셋 정의 ② 동일 학습 예산 ③ 샘플 비용 계산 ④ 신규 물체 성공률 ⑤ 정보 손실 분석으로 비교해야 한다. 데이터 엔지니어는 실험을 재현할 수 있는 provenance와 QA를 제공해야 한다.<\/p>","limit":"데이터 수집 방법의 최적 선택은 작업마다 달라질 수 있다. 실험 설계는 투자비용과 학습 시간까지 포함해야 한다.","apply":"“정답을 모르는 문제에서는 큰 파이프라인을 먼저 짓기보다, 서로 다른 수집 방식의 downstream 기여도와 유효 데이터당 비용을 작게 검증하겠습니다.”","refs":["by25a","by25"],"terms":["Ablation","Data Provenance","Unit Economics"]},{"title":"좋은 연구자 여러 명만으로는 안 된다","one":"류 대표는 복잡한 파운데이션 모델 문제를 한 연구실이 아닌 여러 연구·제품 팀의 협업 문제로 봤다.","deep":"<p>2025년 5월 창업 배경 인터뷰에서 그는 처음에는 교수들에게 개별 창업을 권하려 했지만, 복잡한 문제는 다수 연구자가 팀플레이해야 한다고 판단해 공동 연구·개발 팀을 모았다고 설명했다.<\/p><p>이 관점을 채용 면접에 연결하면 Hand Data Pipeline이 Computer Vision, Robot Control, VLA Training, Infra, 산업 현장 팀 사이의 <strong>인터페이스 엔지니어링<\/strong> 역할을 한다는 점이 중요하다. 연구자 요구사항을 모듈별 스키마·품질 계약·재현 가능한 배포 과정으로 바꾸는 사람이 필요할 수 있다.<\/p>","limit":"창업 과정의 인터뷰를 현재 팀의 의사결정 구조나 입사 후 실제 담당 업무로 일반화할 수 없다.","apply":"“수집·3D 복원·리타게팅·학습 팀의 인터페이스를 명확히 하고, 연구자가 재현 가능한 데이터 계약을 정의하는 데 기여하고 싶습니다.”","refs":["by25a","datajob"],"terms":["Data Contract","Cross-functional"]},{"title":"공감과 용기: 기술이 해결할 문제를 먼저 본다","one":"류 대표는 창업자에게 중요한 것으로 공감 능력과 용기를 직접 언급했다. 엔지니어의 공감은 사용자가 겪는 실제 문제를 정확히 파악하는 데 연결될 수 있다.","deep":"<p>2025년 5월 바이라인 인터뷰 ②에서 그는 창업자의 중요한 요소로 공감과 용기를 들었다. 사회가 겪는 노동력 부족을 이해하고, 기술적으로 아직 정답이 없는 문제에 도전한다는 맥락이다.<\/p><p>엔지니어링 관점으로 전환하면 사용자·현장 작업자·고객이 실제로 어려워하는 작업을 관찰하고 기술 지표로 변환하는 과정이다. 예를 들어 작업자가 어떤 물체에서 가장 자주 재시도하는지 이해하면 필요한 접촉 데이터를 더 효과적으로 수집할 수 있다.<\/p>","limit":"대표가 모든 엔지니어에게 같은 개인적 덕목을 채용 기준으로 사용한다는 근거는 없다. 면접에서는 실제 문제 관찰 경험으로 표현하는 것이 적절하다.","apply":"“고객 현장에서 실제로 병목인 작업을 정확히 이해하고, 기술적인 지표로 바꿔 실험하는 엔지니어가 되고 싶습니다.”","refs":["by25","by25a"],"terms":["Product Empathy","Ownership"]}]},{"id":"industry","title":"02 · 로봇 산업의 현실과 전망","icon":"🏭","desc":"성숙한 자동화와 아직 초기인 범용 정밀 조작 구분","cards":[{"title":"이미 큰 시장, 그러나 모두가 휴머노이드는 아님","one":"2025년 전 세계 산업용 로봇 신규 설치 약 60.3만 대, 가동 약 507.9만 대. 이는 기존 산업용 로봇을 포함한 통계다.","deep":"<p>IFR World Robotics 2026에 따르면 2025년 전 세계 산업용 로봇 신규 설치는 603,307대(+11%), 운영 중인 로봇은 약 507.9만 대였다. 한국은 약 3만 대로 세계 4위 시장이다.<\/p><p>이는 제조 자동화가 이미 큰 산업임을 뜻하지만 <strong>파운데이션 모델 기반 휴머노이드의 실제 상용 설치 규모<\/strong>라고 읽으면 안 된다. 기존 로봇은 고정 동작·정형화된 공정의 생산성이 이미 높다.<\/p>","limit":"산업용 로봇 시장의 성장률을 범용 휴머노이드 시장의 확정 성장률처럼 제시하지 말 것.","apply":"“로봇은 이미 성숙한 자동화 산업이지만, AI가 새로 열 시장은 기존 방식으로 자동화하기 어려웠던 작업입니다.”","refs":["ifrobot"],"terms":["Industrial Robot","Humanoid"]},{"title":"왜 손동작이 마지막 난관인가","one":"물체의 형태·마찰·힘·접촉 순서가 바뀌면 규칙 기반 자동화의 비용이 급증한다.","deep":"<p>반복 용접과 일정한 위치의 파지는 기존 로봇으로 잘 처리한다. 반면 얇은 천 펼치기, 불규칙 포장, 손가락 내 물체 회전처럼 접촉이 자주 바뀌는 조작은 물체 상태 추정과 실시간 피드백을 동시에 요구한다.<\/p><p>손가락 관절이 많아지는 것만으로 숙련도는 생기지 않는다. 감각과 제어 모델이 결합되어야 한다. RLDX-1은 공간·시간·접촉·맥락 문제를 별도의 기능으로 다뤘다.<\/p>","limit":"5지 손이 모든 작업의 최적 해법은 아니다. 단순 고속 피킹은 평행 그리퍼·전용장비가 가격과 신뢰성에서 우세할 수 있다.","apply":"“언제 다섯 손가락이 정말 필요한지를 작업 기준으로 분리해야 모델과 데이터 투자 우선순위를 정할 수 있습니다.”","refs":["rldx","aws"],"terms":["Dexterity","Contact-rich"]},{"title":"기술 성공과 경제적 성공 사이의 간극","one":"실험실 성공률은 현장 수익성의 필요조건일 뿐 충분조건이 아니다.","deep":"<p>로봇 운영비는 장비·SW 사용료·통합·유지보수·고장·사람 개입·오류 피해비용을 모두 포함한다. 작업을 90% 성공해도 실패마다 작업자가 3분 개입하면 경제성이 무너질 수 있다. 반대로 빠른 안전 재시도로 완료 작업량이 높은 시스템은 단일 시도 성공률이 조금 낮아도 유리할 수 있다.<\/p><p>2026년 10월 리얼월드 CPO는 속도, 새로운 환경에 대한 적응 시간, 실패 후 재시도를 중요하게 설명했다.<\/p>","limit":"안전·고가 물체 파손이 중요한 작업에서는 빠른 재시도만으로 실패를 용인할 수 없다.","apply":"“모델 성능을 성공률 외에도 시간당 성공 작업, 자동 복구율, 개입률, 실패당 비용으로 연결하고 싶습니다.”","refs":["ed26","aws"],"terms":["Task Throughput","Recovery","TCO"]},{"title":"실현 속도에 대한 시각","one":"언어 AI와 물리 제어는 난이도가 다르며 범용 로봇의 보급 시점을 확정적으로 말하기 어렵다.","deep":"<p>류 대표는 2026년 DE:NOISE에서 화려한 데모와 실제 산업 작업을 구분하며, 로봇 제어는 시간 연속적인 물리 세계에서 접촉과 마찰을 처리해야 하므로 LLM의 확산 속도를 그대로 적용하면 안 된다고 말했다.<\/p><p>따라서 산업 전망은 <strong>높은 구조적 수요 + 아직 남은 기술·안전·유닛 이코노믹스 문제<\/strong>를 동시에 인정하는 것이 더 설득력 있다.<\/p>","limit":"범용 로봇이 정확히 언제 인간 노동을 대체할지, 특정 회사가 독점할지는 확인되지 않은 예측이다.","apply":"“로봇 산업은 커질 것으로 보지만 몇 년 내 전면 대체보다 작업 단위별로 경제성을 증명하며 확장될 것 같습니다.”","refs":["dn26","ed26"],"terms":["Generalization","Automation ROI"]}]},{"id":"stack","title":"03 · 하드웨어·데이터·모델·플랫폼","icon":"🧱","desc":"가치사슬과 협상력, 모방 난이도 분석","cards":[{"title":"하드웨어의 상품화는 부분적이다","one":"표준 팔·부품은 가격 경쟁이 일어나기 쉽지만 고성능 로봇 손·센서·양산 품질은 여전히 차별화된다.","deep":"<p>기계 구조가 복잡할수록 관절 백래시, 토크, 열, 내구성, 촉각 센서의 신뢰성이 성능 상한을 결정한다. <strong>모델이 물리적인 힘 부족을 보상할 수는 없다.<\/strong> 반면 동일 성능의 표준 액추에이터와 그리퍼가 다수 공급된다면 하드웨어 제조사의 차별성은 약해질 수 있다.<\/p><p>류 대표는 하드웨어가 장기적으로 범용재가 될 것으로 전망하면서도 위로보틱스 등 좋은 하드웨어 파트너가 필요하다고 인정했다.<\/p>","limit":"하드웨어 상품화 전망은 사실이 아닌 가설. 작업별 특수 장비가 계속 경제적으로 우세할 수 있다.","apply":"“하드웨어는 사라지는 경쟁력이 아니라, 표준화되는 부분과 물리적 차별화가 남는 부분으로 나눠 보겠습니다.”","refs":["dn26","by25"],"terms":["Embodiment","Actuator","Tactile Sensor"]},{"title":"데이터는 양보다 정보 구조와 권리가 중요","one":"기업 현장 접근권과 물리적으로 중요한 신호, 학습 기여도, 재사용 권리가 결합될 때 데이터가 진입장벽이 된다.","deep":"<p>일반 RGB 영상에 손 포즈가 있더라도 접촉력, 물체의 미세 운동, 전후 원인관계가 없으면 어떤 작업은 배울 수 없다. 좋은 데이터셋은 정확성·다양성·어려운 실패 사례·동기화·행동 의미를 함께 갖춰야 한다.<\/p><p>고객사 A의 데이터를 다른 고객의 학습에 쓸 수 있는지 계약상 권리가 없으면 데이터가 많아져도 범용 모델 플라이휠은 제한된다.<\/p>","limit":"희소한 데이터도 모델 성능에 도움이 되지 않으면 경쟁 우위가 아니다. 데이터 독점과 성능 독점은 다르다.","apply":"“데이터 가치는 GB가 아니라 검증된 downstream 성능 개선과 재사용 가능성에 있다고 봅니다.”","refs":["dn26","by25","aws"],"terms":["Data Moat","Dataset Curation"]},{"title":"모델은 재사용의 중심이지만 가격 압박도 받는다","one":"RFM은 여러 작업으로 이전 가능할 때 높은 소프트웨어 확장성을 갖지만, 공개모델 향상으로 차별성이 줄어들 수 있다.","deep":"<p>RT-2, OpenVLA, π₀, GR00T 계열처럼 대규모 사전학습과 공개 생태계가 발전하면 기본 조작 능력의 시장 가격이 하락할 수 있다. 고객별 파인튜닝 비용과 배포 신뢰성이 차별점이 된다.<\/p><p>RLDX-1은 공개된 시각언어 백본(Qwen3-VL)과 특화된 물리·기억·행동 구조를 결합한다. 코드 Apache 2.0과 모델 가중치 비상업적 라이선스를 구분해야 한다.<\/p>","limit":"모델의 오픈소스화 = 모든 상업 계약이 무료라는 뜻도, 리얼월드의 정확한 라이선스 매출을 알고 있다는 뜻도 아니다.","apply":"“핵심은 모델 소유 그 자체보다 모델의 재사용 가치와 고객의 전환 비용이라고 생각합니다.”","refs":["rldxrepo","rldx","by25"],"terms":["Foundation Model","Open Weights","Fine-tuning"]},{"title":"플랫폼의 교체 비용은 어디서 생기나","one":"수집·라벨링·학습·검증·배포가 실제 고객 운영에 묶일 때 통합 비용과 전환 비용이 생긴다.","deep":"<p>단순 ETL이나 파일 변환 코드는 경쟁사가 쉽게 재개발할 수 있다. 그러나 로봇 수백 대의 로그 스키마, 안전 검증, 재학습, 버전·롤백, 현장 지표가 한 체계로 운영되면 전환이 어려워진다.<\/p><p>리얼월드는 DexBench, 모델, 데이터 표준, 고객 RX·RD를 연결하려 한다. 동시에 NVIDIA 같은 플랫폼 사업자와 협력하며 범용 도구를 활용한다.<\/p>","limit":"플랫폼 지위를 선언한다고 생태계가 생기지 않는다. 고객 수·외부 채택·교체비용은 별도로 검증해야 한다.","apply":"“범용 인프라는 활용하고, 정밀 조작에서만 리얼월드만의 데이터·평가 지능을 만드는 게 현실적이라고 봅니다.”","refs":["dexbench","aws","datajob"],"terms":["MLOps","Vendor Lock-in","API"]},{"title":"응용 서비스가 돈을 버는 조건","one":"고객은 모델이 아니라 성공 작업의 총비용을 산다.","deep":"<p>산업 애플리케이션의 구매 결정은 생산량, 안전성, 사람 개입, 유지보수, 라인 중단 위험으로 이뤄진다. 모델 제공자가 작업 과정까지 함께 운영하면 고객과 깊게 연결되지만 프로젝트 인력 비용이 늘 수 있다.<\/p><p>사업 구조를 분석할 때 <strong>모델 성능→현장 배포 비용→계약 반복성→장기 마진<\/strong> 순서로 보는 것이 유용하다.<\/p>","limit":"작업 성공률이 높다는 논문 결과는 고객사의 실제 지불 의사나 반복 매출 증거가 아니다.","apply":"“기술을 고객의 TCO와 연결하는 과정이 가장 중요하다고 봅니다.”","refs":["aws","i26"],"terms":["TCO","Gross Margin"]}]},{"id":"winner","title":"04 · 승자독식과 대체 가능성","icon":"♟️","desc":"Winner-take-all이 성립하는 조건과 반례","cards":[{"title":"전체 로봇 시장이 한 회사 독점일까?","one":"물리 장비와 작업 환경의 다양성 때문에 로봇 전체는 소수 독점보다는 계층별 집중이 더 현실적인 가설이다.","deep":"<p>반도체·학습 플랫폼은 규모의 경제와 개발 생태계가 집중을 촉진한다. 반면 현장 통합은 지역 인허가, 고객 관계, 공정 차이로 분산될 수 있다. RFM은 특정 플랫폼을 넘어 동일한 지능을 여러 로봇에 공급할 수 있다면 집중이 커질 수 있다.<\/p><p>승자독식을 논하려면 네트워크 효과, 학습 데이터 플라이휠, 고객 전환 비용, 유통, 규모의 경제를 각각 구분해야 한다.<\/p>","limit":"시장 집중이 곧 이익률 보장은 아니다. 플랫폼의 점유율이 높아도 무료 경쟁이나 높은 컴퓨팅 비용으로 마진이 낮을 수 있다.","apply":"“로봇 전체보다 특정 계층의 winner-take-most를 예상합니다. 어디에 전환 비용이 생기는지 보겠습니다.”","refs":["dn26","dexbench"],"terms":["Winner-take-most","Network Effect"]},{"title":"데이터 플라이휠은 언제 진짜인가","one":"현장 배치가 늘수록 다른 고객에 대한 모델 성능이 개선되고, 다음 배포 비용이 줄어들어야 한다.","deep":"<p>고객 A→희소 데이터→공통 모델 개선→고객 B 적응 비용 축소→신규 배포→추가 데이터라는 순환이 이상적이다. 그러나 A에서 얻은 데이터가 B에 통하지 않거나 사용권이 없다면 순환이 끊긴다.<\/p><p>실무적으로는 <strong>고객당 신규 작업 적응 비용, 재사용된 학습 데이터 비율, 신규 embodiment onboarding time<\/strong> 같은 지표가 플라이휠의 강도를 보여준다.<\/p>","limit":"데이터셋 크기만 증가하는 것은 플라이휠이 아니다. 공통 모델 성능과 고객 경제성 개선으로 연결되어야 한다.","apply":"“현장 수가 2배가 됐을 때 다음 현장 적용 비용이 줄어드는지를 확인하고 싶습니다.”","refs":["dn26","aws"],"terms":["Data Flywheel","Cross-Embodiment"]},{"title":"실제 가장 대체되기 쉬운 것","one":"범용 파서·표준 ETL·일반 영상 인식 일부는 대체가 쉽고, 데이터 접근권·물리 검증·현장 통합은 어렵다.","deep":"<p>일반적인 파일 변환과 단일 모델 inference wrapper는 오픈소스로 쉽게 재구축된다. 반대로 접촉 물리 데이터 수집, 현장 실패 정의, 서로 다른 손의 목적 중심 리타게팅, 실물 정합성 테스트는 시스템·실험·협업이 필요하다.<\/p><p>이 때문에 Hand Data Pipeline은 <strong>일반적인 데이터 레이크 구축<\/strong> 이상의 기술 해자로 발전시켜야 한다.<\/p>","limit":"접촉 추정·3D 복원도 발전이 빨라지고 있다. 시간이 지나면 일부 핵심 알고리즘도 범용화될 수 있다.","apply":"“대체가 쉬운 기능은 표준도구를 적극 사용하고, 희소한 물리 정보가 보존되는 구간에 역량을 집중하겠습니다.”","refs":["rldx","huro","hope"],"terms":["Commoditization","Retargeting"]},{"title":"리얼월드에 불리한 시나리오도 알아야 한다","one":"거대 기업의 기본 정책이 충분해지거나 고객별 시스템 통합이 줄지 않으면 독립 RFM 회사는 가격 압박을 받는다.","deep":"<p>시나리오 A: 공개 범용 VLA가 대부분의 작업을 잘 처리해 모델 차별성이 하락. B: 로봇 제조사가 하드웨어와 모델을 수직 통합. C: 고객별 작업과 데이터가 너무 특수하여 다른 고객으로 이전이 어려움. D: 현장 실증의 안전·규제·운영 비용이 매우 높음.<\/p><p>그럼에도 산업의 희소 데이터, 빠른 적응, 실제 배포 능력을 확보하면 전문 영역에서 수익화 기회가 있다.<\/p>","limit":"대표의 전략과 얼라인하려면 위험을 감추지 말고 검증 가능한 질문으로 바꿔야 한다.","apply":"“범용 모델 상품화 위험은 인정하지만 현장 데이터와 빠른 적응이 차별화 가능한지 실험으로 검증하고 싶습니다.”","refs":["dn26","bell26","ed26"],"terms":["Vertical Integration","Moat"]}]},{"id":"economics","title":"05 · 사업 모델과 수익성","icon":"💸","desc":"API에서 서비스형 노동까지, 무엇이 실제로 돈이 되는가","cards":[{"title":"모델 API와 라이선스","one":"한 번 개발한 지능을 여러 고객에 공급할 수 있으면 높은 규모의 경제가 가능하다.","deep":"<p>2025년 류 대표는 다른 로봇 업체가 리얼월드의 API를 선택해 쓰는 방식을 언급했다. 수익 방식은 모델당, 로봇당, 호출량당, 현장당, 성과당 등 다양할 수 있다. 그러나 실제 가격표·고객별 계약 조건은 공개적으로 확인되지 않는다.<\/p><p>로봇 모델은 고객 하드웨어와 실시간 추론 및 안전 시스템에 맞춰야 해 단순 HTTP API만으로 모든 고객이 도입하기 어렵다.<\/p>","limit":"“라이선스 비용을 받는다”는 전략 방향은 근거가 있지만, 지금 어느 방식으로 얼마나 매출이 발생하는지는 확인되지 않았다.","apply":"“초기에는 통합 비용이 있더라도 공통 모델 재사용률이 올라가면 소프트웨어 사업성은 개선될 수 있습니다.”","refs":["by25","rldxrepo","datajob"],"terms":["Licensing","API/SDK"]},{"title":"PoC→현장 운영→구독의 전환","one":"사업성의 핵심은 협업 발표 수보다 유료 전환·반복 매출·배포 원가 감소다.","deep":"<p>리얼월드가 고객과 RX(업무 평가), RD(배포) 단계로 일한다는 AWS 사례가 있다. CJ대한통운과 물류 AI 공동개발 MOU도 확인된다. 이는 실제 상용화를 향한 활동이지만, MOU·실증이 곧 대규모 계약 매출이라는 뜻은 아니다.<\/p><p>확인하고 싶은 핵심 지표는 PoC→유료 배포 전환율, 현장당 반복 매출, 배포 기간, 모델 적응 비용, 사람 개입 비용 등이다.<\/p>","limit":"고객사에서 테스트 중인 기술과 상업 생산라인에서 완전 운영되는 기술을 동일하게 말하지 말 것.","apply":"“PoC 수보다는 유료 운영으로 전환되는 데 걸리는 시간과 단위 경제성을 개선하는 게 중요하다고 봅니다.”","refs":["aws","cj","i26"],"terms":["PoC","ARR","RX","RD"]},{"title":"RaaS와 월급 받는 로봇","one":"AI SW 구독과 로봇 임대를 묶는 서비스형 노동은 고객의 초기 지출을 줄이지만 제공자의 비용을 늘릴 수도 있다.","deep":"<p>2026년 9월 류 대표는 소프트웨어 구독료와 하드웨어 임대료가 결합된 월 단위 노동 서비스를 직접 설명했다. 고객 입장에서는 비용 예측 가능성과 서비스 계약이 장점이다.<\/p><p>반대로 공급자는 장비 감가상각, 현장 지원, 고장, 보험, 안전관리의 리스크를 떠안게 된다. 소프트웨어 수준의 높은 마진을 자동으로 누리지는 못한다.<\/p>","limit":"RaaS의 성장 = 좋은 현금흐름 보장은 아니다. 자산을 누가 소유하는지, SLA를 누가 보장하는지에 따라 경제성이 달라진다.","apply":"“월 과금 사업에서도 중요한 건 시간당 유효 작업과 장애·개입 비용을 같이 관리하는 것입니다.”","refs":["i26","aws"],"terms":["RaaS","SLA","Unit Economics"]},{"title":"작업 단위의 유닛 이코노믹스","one":"고객은 모델 벤치마크 점수가 아니라 성공적으로 수행한 작업의 총비용을 비교한다.","deep":"<p><strong>성공 작업당 총비용 = (장비·SW·운영·재작업·안전 비용) / 성공적으로 완료한 작업 수<\/strong>.<\/p><p>가상의 예시: 1회 성공률 90%, 8초 시도, 실패 시 안전 재시도 가능이라면 기대 완료 시간은 단순 조건에서 약 8/0.9=8.9초다. 그러나 실패 시 작업이 망가지거나 사람이 3분 개입해야 한다면 비용이 크게 달라진다. 이런 조건을 수식에 넣어 비교해야 한다.<\/p>","limit":"가정용 계산은 설명 예시이며 실제 리얼월드 수익성 숫자가 아니다. 각 작업의 위험 비용과 다운타임 반영 필요.","apply":"“작업별로 재시도 가능성과 오류 비용이 달라서 성공률 하나만으로 ROI를 평가하지 않겠습니다.”","refs":["ed26","i26"],"terms":["Unit Economics","Task Throughput","ROI"]}]},{"id":"country","title":"06 · 미국·중국·한국·일본의 포지션","icon":"🌏","desc":"글로벌 조별과제 전략과 한국의 진짜 강점","cards":[{"title":"미국은 기반기술과 자본","one":"미국의 강점은 AI 연구 인력·대형 플랫폼·컴퓨팅·자본 시장이다.","deep":"<p>범용 RFM과 하드웨어를 동시에 개발하려면 커다란 투자와 플랫폼 생태계가 유리하다. 그러나 국가별 산업 현장에서의 접근권은 규모가 큰 기업이라고 자동 확보되는 것이 아니다.<\/p><p>류 대표는 한국·일본의 현장과 미국의 기술·자본을 연결하는 글로벌 구조를 강조했다.<\/p>","limit":"미국 빅테크가 모두 B2B 현장을 모른다는 표현은 대표의 경쟁 가설이지 객관적 전체 사실은 아니다.","apply":"“미국 기술 생태계와 경쟁하면서도 필요한 기반 기술은 협력해 사용하는 모델이라고 이해했습니다.”","refs":["bell26","dn26","aws"],"terms":["Ecosystem","Foundation Layer"]},{"title":"중국은 제조 공급망·가격·대량 실험","one":"중국의 2025년 산업용 로봇 신규 설치는 약 35.4만 대로 세계 최대 규모다.","deep":"<p>로봇 제조 생태계, 부품 공급망, 대규모 내수는 가격과 배포 속도에서 큰 장점이다. 한국이 로봇 양산 대수만으로 경쟁하는 것은 어려울 수 있다.<\/p><p>반면 산업별 고숙련 작업과 실제 데이터의 법적 재사용을 묶는 사업에서는 물량 외의 차별화 수단이 생길 수 있다.<\/p>","limit":"“중국은 값싼 로봇만 만든다”는 식의 단순화는 사실에도 부합하지 않는다. 연구·모델 경쟁력도 빠르게 발전한다.","apply":"“양산 규모로 정면 승부하기보다 현장의 고품질 정밀 조작 데이터로 차별화하는 전략이 합리적이라고 봅니다.”","refs":["ifrobot","dn26"],"terms":["Manufacturing Scale"]},{"title":"한국은 숙련 산업현장과 기술 인재","one":"로봇 밀도와 제조 역량은 장점이지만 학습 데이터로 바꾸는 과정은 별도의 난제다.","deep":"<p>제조·전자·반도체·물류 등에 숙련 작업자가 있고 AI·기계·전자 분야의 역량을 연결할 수 있다. 그러나 공정 데이터는 기업의 지식재산이며 작업자의 행동 기록에도 권리·보안·안전 문제가 있다.<\/p><p>한국의 강점은 <strong>많은 공장이 존재한다<\/strong>에서 끝나지 않는다. 고객의 승인 아래 물리적 정보를 재구성하고 학습할 수 있게 만드는 역량으로 전환돼야 한다.<\/p>","limit":"산업용 로봇 밀도가 높다는 것만으로 데이터 품질이나 RFM 학습에 대한 사용권이 충분하다는 뜻은 아니다.","apply":"“산업 접근권을 모델 학습에 재사용 가능한 신호로 바꾸는 게 한국에 있는 우리 같은 엔지니어의 기회입니다.”","refs":["dn26","bell26","aws"],"terms":["Industrial Data","Data Rights"]},{"title":"일본은 고객 수요와 현장 실증","one":"고령화·현장 인력 부족이 서비스·물류·제조에서 자동화 수요를 높이는 시장이다.","deep":"<p>류 대표는 호텔과 편의점은 해외 저임금 지역으로 공장처럼 옮기기 어렵다고 설명한다. 따라서 위치 제약이 있는 서비스·물류는 로봇 도입의 경제성이 커질 수 있다.<\/p><p>리얼월드는 초기부터 일본 법인과 파트너십을 추진했다고 발표했다. 한국 AI 역량+일본 산업 수요를 결합한다는 것이 전략이다.<\/p>","limit":"일본 전체 AI 연구역량이 없다는 식의 일반화는 부정확하다. 기업별 강점을 별도로 봐야 한다.","apply":"“한국과 일본의 산업 현장 피드백이 모델 개선 주기를 앞당길 수 있다는 부분이 매력적입니다.”","refs":["dn26","bell26"],"terms":["Localization","Deployment"]}]},{"id":"tech","title":"07 · 리얼월드 기술 전략과 현재의 연구","icon":"🧠","desc":"RLDX-1, 4D+, DexBench, 2026년 최신 연구","cards":[{"title":"RLDX-1은 어떤 모델인가","one":"시각·언어만으로 부족한 손의 물리 제어를 위해 움직임·기억·촉각/토크를 통합한 정밀 조작 VLA다.","deep":"<p>RLDX-1 기술 보고서는 <strong>Multi-Stream Action Transformer(MSAT)<\/strong>를 중심에 두고 cognition, physics, action 정보 흐름을 통합한다고 설명한다. Motion module은 영상의 시간 변화를, memory는 과거 인지 정보를, 힘·촉각 경로는 접촉 기반 제어를 지원한다.<\/p><p>회사 설명상 단일팔·양팔·휴머노이드 등 여러 embodiment에 적용한다. 다만 성능은 학습된 데이터·설정에 따라 달라진다.<\/p>","limit":"공식 벤치마크 수치는 회사 자체 보고. 서로 다른 연구의 수치를 동일 조건의 독립 실험으로 해석하면 안 된다.","apply":"“RLDX-1은 시각 인식을 잘하는 것을 넘어 실제 작업의 시간·접촉·기억 문제를 아키텍처에 반영한 모델로 이해했습니다.”","refs":["rldx","rldxpaper","rldxrepo"],"terms":["VLA","MSAT","Proprioception"]},{"title":"5가지 정밀 조작 난제","one":"파지 다양성·공간 정밀도·시간 정밀도·접촉 정밀도·맥락 인지를 분리해 실패 원인을 보는 전략이다.","deep":"<p><strong>Grasp Diversity<\/strong>: 손과 물체가 다양한 형태로 상호작용. <strong>Spatial<\/strong>: 접촉 전에 정확한 위치 접근. <strong>Temporal<\/strong>: 움직이는 물체에 맞춘 타이밍. <strong>Contact<\/strong>: 토크·촉각·힘에 대응. <strong>Context<\/strong>: 긴 작업에서 이전 상태를 기억하는 능력.<\/p><p>각 문제는 요구 데이터가 다르다. 예컨대 컨베이어 피킹은 프레임 동기화, 커피 붓기는 토크와 액체 무게 변화, 다단계 포장은 장기 기억이 관건이다.<\/p>","limit":"다섯 범주는 리얼월드의 자체 문제 분류이며 모든 로봇 연구의 공인 표준은 아니다.","apply":"“모델이 실패한 영역에 따라 수집 센서와 품질 지표를 달리해야 한다고 생각합니다.”","refs":["rldx","dexbench"],"terms":["Grasp Diversity","Temporal Precision"]},{"title":"4D+가 실제로 의미하는 것","one":"손과 물체의 3D 기하에 시간·접촉·물리 신호를 결합해 행동의 원인을 학습 가능하게 만드는 전략이다.","deep":"<p>정적인 손 포즈만 있으면 접촉 순서·미끄러짐·파지력 변화가 소실된다. 리얼월드의 4D+는 시간에 따라 변하는 손·물체·물리적 상호작용을 한 데이터 구조로 연결하려는 목표다.<\/p><p>핵심 설계 질문은 무엇을 실제 센서로 <strong>측정<\/strong>했고 무엇을 비전으로 <strong>추정<\/strong>했는지 표시할 수 있느냐다. 불확실성을 무시하면 품질 관리가 불가능해진다.<\/p>","limit":"4D+는 회사가 사용하는 기술 표현이며 단일한 보편 학술 규격으로 확정된 것은 아니다.","apply":"“실측 토크와 영상에서 추정한 압력은 다르게 다뤄야 하며, provenance·confidence를 함께 저장하는 것이 중요합니다.”","refs":["rldx","aws","hope"],"terms":["4D+","Contact","Confidence"]},{"title":"DexBench가 플랫폼 전략인 이유","one":"모델과 로봇의 조작 능력을 같은 작업 조건에서 평가하고 데이터 형식을 연결하는 시도다.","deep":"<p>류 대표는 고객마다 성공률 정의가 달라 로봇 간 비교가 어렵다고 지적했다. DexBench는 실제 산업 현장 기반의 공통 태스크와 NVIDIA Isaac Lab 연동을 추진한다.<\/p><p>평가 표준은 고객 선택과 모델 개선의 공통 언어가 될 수 있다. 데이터 수집 스키마와 모델 실패 분류가 공통 벤치마크에 연결되면 플랫폼의 활용도가 높아질 수 있다.<\/p>","limit":"협력을 발표한 것과 시장 전체가 DexBench를 공인·채택했다는 것은 다르다. 독립 공정성을 검증해야 한다.","apply":"“수집 데이터가 평가 태스크와 연결되면 무엇을 더 모을지 정하기 쉬워져 학습 우선순위가 분명해질 것 같습니다.”","refs":["nd26","dexbench"],"terms":["Benchmark","DexBench"]},{"title":"2026년 연구에서 드러난 방향","one":"HuRo, HOPE, PointWAM, AutoDex 등은 모델 앞뒤의 데이터·물리·현장 검증을 직접 다룬다.","deep":"<p><strong>HuRo<\/strong>: 여러 출처의 사람 영상을 로봇과 정렬된 관측·행동으로 전환. <strong>HOPE<\/strong>: 단안 RGB로 손 mesh의 접촉과 압력을 예측. <strong>PointWAM<\/strong>: 손과 장면의 3D 궤적을 공동 예측. <strong>AutoDex<\/strong>: 실제 로봇으로 파지를 시도하고 성공·실패를 자동 라벨링.<\/p><p>이 연구들은 Hand Data Pipeline이 단순 보조 시스템이 아니라 모델의 학습 가능한 신호를 만드는 연구·제품 접점이라는 근거다.<\/p>","limit":"공식 연구 목록에 있다고 모두 리얼월드 단독 개발이나 완성된 상용 기능을 뜻하는 것은 아니다. 대학 공동연구와 실험 조건을 확인해야 한다.","apply":"“특히 HuRo의 robotization과 HOPE의 pressure 표현은 제가 맡을 일과 매우 밀접합니다.”","refs":["res","huro","hope","pointwam","autodex"],"terms":["Robotization","World Model","Data Engine"]}]},{"id":"pipeline","title":"08 · Hand Data Pipeline 설계 지도","icon":"🖐️","desc":"Capture → Reconstruction → Interaction → Retarget → QA → Learning","cards":[{"title":"Capture: 시간과 좌표계를 먼저 믿을 수 있어야","one":"카메라·IMU·토크·센서의 원시 데이터와 타임스탬프·캘리브레이션을 함께 확보한다.","deep":"<p>영상 30fps와 관절 상태 200Hz, 힘 센서 1kHz를 한 episode에 결합할 수 있다. 시간 오프셋이 몇 프레임만 어긋나도 접촉 순간의 행동·물체 상태가 잘못 대응된다. 카메라 내부·외부 파라미터, 센서 clock, rolling shutter, 카메라 드리프트, 프레임 drop을 기록한다.<\/p><p><strong>권장 산출물<\/strong>: 원본 데이터 불변 보관, episode_id, 공통 clock reference, extrinsics/intrinsics, calibration_version, 센서별 missing mask 및 synchronization error.<\/p>","limit":"센서 정렬을 잘해도 영상만으로 접촉력을 정확히 관측한 것이 아니다. 측정과 추정을 분리해야 한다.","apply":"“파이프라인의 출발점은 데이터를 빠르게 복사하는 게 아니라 시간·좌표 기준을 신뢰할 수 있게 만드는 일입니다.”","refs":["rldx","aws","datajob"],"terms":["Calibration","Synchronization","IMU","Clock Drift"]},{"title":"Reconstruction: 손과 물체를 같은 3D 공간에","one":"2D 키포인트가 아니라 손·물체·카메라의 시공간 일관성을 복원해야 한다.","deep":"<p>MANO 같은 parametric hand model은 손 모양·관절 파라미터를 일관되게 표현하는 데 유용하다. 다중뷰 영상과 3D Gaussian Splatting은 작업 공간·시점 변화를 복원하는 도구가 될 수 있다.<\/p><p>문제는 occlusion, 손가락 관통, 물체 대칭성, 스케일 모호성, 좌우 손 혼동이다. 재투영 오차만 최소화하면 물리적 충돌이 생길 수 있으므로 관절 제한, 물체 6D pose, temporal smoothness, 손–물체 간 접촉 제약을 함께 본다.<\/p>","limit":"3DGS는 보이는 장면의 새로운 시점 합성·표현 기술이지 정확한 힘이나 접촉력을 직접 측정하는 방법은 아니다.","apply":"“재투영이 잘 되는 것과 로봇 학습에 물리적으로 맞는 궤적인지는 별도 검증해야 합니다.”","refs":["rldx","huro","hope"],"terms":["MANO","3DGS","6D Pose","Occlusion"]},{"title":"Interaction: 손–물체 관계가 핵심","one":"포즈만으로 충분하지 않은 순간에 접촉·미끄러짐·압력·물체 반응이 중요해진다.","deep":"<p>예를 들어 병 뚜껑 회전은 단순 wrist rotation이 아니라 손가락 접촉 위치와 파지력, 뚜껑 torque, 병 고정 동작의 조합이다. RGB 영상은 일부 접촉 이벤트를 추론할 수 있으나 실제 힘의 단위값을 직접 관측한 것과는 다르다.<\/p><p>HOPE는 RGB 비디오를 입력으로 손 mesh vertex별 접촉과 압력을 예측하도록 연구했다. 모델 추정값에는 domain shift와 불확실성이 있으므로 직접 측정된 force/torque와 메타데이터를 분리하는 설계가 바람직하다.<\/p>","limit":"영상 기반 힘 추정 연구 성과를 범용적으로 정확한 실제 힘 센서 대체로 해석하지 말 것.","apply":"“관측 불가능한 물리량은 관측한 사실처럼 넣지 않고 추정의 신뢰도를 포함해 품질을 통제하겠습니다.”","refs":["hope","rldx","sept26"],"terms":["Contact Map","Pressure Estimation","Torque"]},{"title":"Retargeting: 인간 관절 복사가 아니라 목표 보존","one":"사람과 로봇의 다른 기구학 구조를 고려해 실행 가능한 행동을 만들어야 한다.","deep":"<p>사람과 로봇 손은 손가락 길이, 자유도, 관절 한계, contact surface, 토크 제한이 다르다. Retargeting은 human pose를 IK 또는 최적화 기반으로 robot joint space에 매핑한다.<\/p><p>최적화 항은 손끝 위치뿐 아니라 object-relative pose, 접촉 유지, 관절/속도 제한, 자기충돌 회피, 작업 목표 달성을 포함할 수 있다. 실행 전 시뮬레이션에서 물리적 타당성과 실패 조건을 검사한다.<\/p>","limit":"사람의 움직임을 시각적으로 닮게 만드는 것이 작업 성공을 의미하지는 않는다. robot morphology에 맞춘 재설계가 필요하다.","apply":"“joint angle reproduction보다 task outcome, contact preservation을 보존하는 retargeting을 중시하겠습니다.”","refs":["rldx","huro","pointwam"],"terms":["Retargeting","Inverse Kinematics","Embodiment Gap"]},{"title":"Quality: 처리 성공과 학습 성공은 다르다","one":"데이터 수율, 물리적 유효성, 다양성과 학습 기여도를 분리하여 검증한다.","deep":"<p>자동 QA는 누락 프레임, extrinsic drift, 3D pose reprojection, joint bounds, 충돌·관통, temporal jump, contact inconsistency, task segmentation 오류를 확인할 수 있다.<\/p><p>다양성은 이미지 수보다 대상 물체·작업·장면·센서 조건·실패 유형의 커버리지로 평가한다. hard example을 더 많이 얻는 것과 분포를 왜곡해 성능을 떨어뜨리는 것은 구분해야 한다.<\/p>","limit":"QA 점수가 높다고 모델 성능이 자동 상승하지 않는다. 작은 통제 실험에서 ablation을 거쳐야 한다.","apply":"“수율을 높인 뒤에도 데이터 버전별 model uplift를 반드시 확인하고 싶습니다.”","refs":["datajob","rldx","huro"],"terms":["Data QA","Ablation","OOD"]},{"title":"Training Feedback: 실패가 다음 데이터가 된다","one":"배포 모델의 실패를 유형별로 분류해 필요한 데이터만 더 수집·처리한다.","deep":"<p>실패는 인지(물체 오검출), 기하(손·물체 좌표 오차), 동작(접촉 순서), 물리(힘 제어), 시간(늦은 반응), 시스템(GPU 지연·I/O)으로 나눌 수 있다.<\/p><p>각 원인에 따라 데이터 수집 계획과 검증 방법이 달라져야 한다. 실패 후 전문가가 교정한 궤적을 추가하는 DAgger류 접근은 자기 정책이 실제로 방문하는 상태의 데이터로 재학습하는 아이디어다.<\/p>","limit":"배포 데이터는 안전·동의·영업비밀·고객 계약의 허용 범위 안에서 확보해야 한다.","apply":"“운영 실패를 구조화한 데이터로 만들고, 어떤 모델 개선이 필요한지 되돌려주는 시스템을 만들고 싶습니다.”","refs":["rldx","dn26","ed26"],"terms":["DAgger","Error Taxonomy","Closed Loop"]}]},{"id":"dataeng","title":"09 · 실전 시스템 엔지니어링","icon":"⚙️","desc":"GPU·스토리지·포맷·재현성과 장애 복구","cards":[{"title":"데이터 스키마를 처음부터 잘 설계하기","one":"원시 신호·추정 결과·파생 데이터·학습용 episode를 분리하고 lineage를 추적한다.","deep":"<p>최소한 episode_id, timestamp, frame_id, sensor_type, robot_id, embodiment_version, calibration_version, world_frame, task, source_provenance, confidence, code_version, data_license가 필요하다. 센서의 고주파 시계열과 비디오 blob을 무조건 한 파일에 넣으면 I/O가 비효율적일 수 있다.<\/p><p>MCAP/rosbag은 센서 로그, Parquet은 구조화 메타데이터, protobuf는 스키마 정의, object storage는 원본 대용량 자료처럼 요구사항에 맞게 나눌 수 있다.<\/p>","limit":"한 포맷이 모든 문제를 해결하지 않는다. 수집·분석·학습 경로의 접근 패턴이 달라 구분이 필요하다.","apply":"“빠른 처리보다 앞서, 나중에 어떤 데이터가 어떤 버전의 캘리브레이션으로 만들어졌는지 재현 가능하게 설계하겠습니다.”","refs":["datajob","aws"],"terms":["MCAP","Parquet","Protobuf","Lineage"]},{"title":"S3·FSx·GPU 학습 I/O 병목","one":"GPU의 학습 시간을 줄이려면 저장·전처리·샤딩·캐시·로딩을 함께 최적화해야 한다.","deep":"<p>AWS 사례에서 S3는 원본·가공 데이터의 내구성 있는 저장소이고 FSx for Lustre는 GPU 노드가 병렬 접근하는 고속 파일시스템 역할을 한다. 데이터 저장량이 커져도 작은 파일 다량 읽기, 불규칙 샘플링, 네트워크 셔플, 디코딩 CPU 병목 때문에 GPU가 놀 수 있다.<\/p><p>shuffle 단위, shard 크기, prefetch, pinned memory, 압축·디코딩, 캐시 적중률을 실제 trace로 측정해야 한다.<\/p>","limit":"인프라만 늘리면 비효율적인 처리 구조가 숨겨질 수 있다. 데이터 품질 향상과 인프라 처리량은 구분해야 한다.","apply":"“모델 연구자가 데이터 대기 때문에 실험을 포기하지 않도록 GPU utilization과 data loading stall을 관리하겠습니다.”","refs":["aws","datajob"],"terms":["S3","FSx","Sharding","GPU Utilization"]},{"title":"파이프라인의 멱등성과 복구","one":"실패한 작업을 다시 수행해도 중복·오염 데이터가 발생하지 않아야 한다.","deep":"<p>대규모 비디오 전처리는 장애가 불가피하다. stage별 content hash, versioned artifact, idempotent write, checkpoint, dead-letter queue, per-episode status, retry policy가 필요하다. 재학습의 재현성은 코드 버전뿐 아니라 원본 데이터 스냅샷과 표준 스키마 버전까지 포함해야 한다.<\/p><p>오류 사례도 별도 보관해 failure mode 분류에 활용할 수 있다.<\/p>","limit":"무제한 retry는 잘못된 데이터를 반복 생성하거나 비용 폭증을 초래할 수 있다. 실패 종류별 복구 정책 필요.","apply":"“확장 가능한 처리량뿐 아니라 재처리와 오류 추적이 가능한 파이프라인을 설계하겠습니다.”","refs":["datajob"],"terms":["Idempotency","Observability","Data Versioning"]},{"title":"품질 제어는 데이터 드리프트도 포함","one":"카메라가 바뀌거나 센서가 노후화되면 같은 파이프라인도 다른 결과를 만든다.","deep":"<p>표본별 확인보다 현장·시간·하드웨어별 데이터 분포가 바뀌는지를 봐야 한다. reprojection error의 이동평균, occlusion ratio, estimated pressure confidence, episode length, force range, sensor missing rate를 dashboard로 모니터링할 수 있다.<\/p><p>새 로봇 손 도입 시 기존 기준선을 그대로 적용하기보다 calibration fixture와 sentinel datasets로 기준을 검증하는 것이 중요하다.<\/p>","limit":"분포 변화가 반드시 품질 저하를 뜻하지 않는다. 새로운 유용한 도메인의 데이터일 수도 있으므로 원인을 구분해야 한다.","apply":"“관측성은 단순 서버 에러율뿐 아니라 물리 데이터의 변화까지 감지할 수 있어야 한다고 봅니다.”","refs":["datajob","rldx"],"terms":["Data Drift","Sentinel Dataset","Monitoring"]}]},{"id":"measurement","title":"10 · 측정 가능한 경쟁력","icon":"📏","desc":"데이터 파이프라인이 진짜 사업 기여를 하는지 검증","cards":[{"title":"시간당 유효 데모 수","one":"Raw demo count보다 품질 검증을 통과한 유효 데모의 생산성이 중요하다.","deep":"<p><strong>Useful demonstrations/hour = QA와 학습 조건을 만족한 데모 수 ÷ 수집·처리에 투입한 인시<\/strong>로 정의할 수 있다. 자동화율이 높아도 유효율이 낮으면 실제 생산성은 낮다.<\/p><p>RLDX-1 문서는 시간당 200개 이상의 human demonstration을 생성할 수 있다고 소개한다. 수치는 특정 회사 파이프라인 조건이며 모든 작업·품질 조건에 일반화할 수 없다.<\/p>","limit":"QA를 통과한 데모도 실제 모델 학습에 기여한다는 보장은 없다.","apply":"“Raw throughput뿐 아니라 valid yield와 downstream 결과를 같이 측정하겠습니다.”","refs":["rldx"],"terms":["Valid Yield","Throughput"]},{"title":"데이터 1개당 실질 비용","one":"수집·정제·검증·재처리 비용과 학습 기여도는 별개로 계산해야 한다.","deep":"<p><strong>Cost/useful demo = (촬영·인력·GPU·스토리지·QA·재시도 비용) / 유효 데모 수<\/strong>. 예를 들어 수집은 싸지만 리타게팅이 번번이 실패하면 전체 비용은 올라간다.<\/p><p>품질이 높은 특수 작업은 비용이 비싸더라도 성공률 개선 폭이 크면 경제적이다. 따라서 cheapest data와 most valuable data는 다르다.<\/p>","limit":"데이터의 장기 재사용 효과까지 포함하면 단일 수집 회차의 원가만으로는 투자 판단이 불완전하다.","apply":"“수집을 싸게 만드는 것과 모델 성능 향상당 비용을 줄이는 것을 구분하고 싶습니다.”","refs":["by25","dn26","autodex"],"terms":["Cost per Useful Demo","Marginal Value"]},{"title":"모델 성능 향상당 데이터 비용","one":"데이터가 모델 성능을 바꾸었는지 평가·학습 조건을 고정해야 한다.","deep":"<p><strong>Model uplift / data budget<\/strong>은 동일한 평가 태스크, 모델 초기 checkpoint, 학습 step, seed를 통제해 추가 데이터만 달리한 실험으로 검증한다. 실패 유형별 개선을 분리하면 어떤 데이터가 유용했는지 알 수 있다.<\/p><p>HuRo 연구는 사람 영상이 로봇과 정렬된 관측·행동으로 바뀌어야 성능 향상 효과가 크다는 점을 보고했다.<\/p>","limit":"다른 모델·시뮬레이터·평가셋을 비교하면 데이터 효과와 모델 효과가 섞일 수 있다.","apply":"“정제 전후의 모델 개선을 통제 실험으로 확인하는 데이터 엔지니어가 되고 싶습니다.”","refs":["huro","rldx"],"terms":["Ablation","OOD Evaluation"]},{"title":"새 로봇 적응 비용과 재사용률","one":"새 embodiment를 온보딩하는 시간·필요 데모·적용 비용이 줄어야 모델 플랫폼의 레버리지가 생긴다.","deep":"<p>새 로봇 손에 대해 하드웨어 config 등록, sensor calibration, retargeting, dataset compatibility, benchmark, 현장 검증이 필요하다. 각 단계의 인적 개입과 실패 시간을 측정해야 한다.<\/p><p>예시 KPI: onboarding day, success threshold까지 필요한 데모 수, retarget validity, dataset reuse %, 24h 자동 처리 성공률, 배포까지의 시간.<\/p>","limit":"서로 다른 로봇에 적용된다는 설명과 동일 성능·제로샷 적용은 다르다.","apply":"“새 로봇에서 학습 성공률에 도달하는 데 필요한 추가 데이터와 시간을 핵심 지표로 보고 싶습니다.”","refs":["rldx","pointwam","huro"],"terms":["Cross-Embodiment","Adaptation Cost"]},{"title":"평가는 작업 비용과 연결되어야","one":"성공률 외에 시간당 완료량, 실패 복구율, 운영자 개입률이 필요하다.","deep":"<p>실제 고객 현장 KPI를 연구 평가와 연결한다. 작업 유형별 성공률, p95 latency, robot downtime, human intervention minutes, recovery success, 손상 발생률, 작업당 비용 등이다.<\/p><p>DexBench와 같은 작업 평가 체계는 비교 가능성을 높일 수 있다. 하지만 평가 분포가 실제 현장을 얼마나 반영하는지, 안전 및 실패 비용을 측정하는지 확인해야 한다.<\/p>","limit":"같은 성공률이라도 작업별 위험도가 다르다. 안전·규제·고객 품질 기준을 단순 평균하면 안 된다.","apply":"“결국 데이터 KPI가 고객의 작업 KPI로 이어지는지 확인해야 합니다.”","refs":["ed26","nd26","dexbench"],"terms":["Benchmark","p95 Latency","Human Intervention"]}]},{"id":"practice","title":"11 · 대표 면접 대화의 구조","icon":"🎤","desc":"동의할 것·반박 가능할 것·실제 사례 연결","cards":[{"title":"얼라인의 핵심은 아첨이 아닌 가설 공유","one":"회사의 방향을 이해하고, 어떤 조건에서 그 전략이 성립하는지 기술적으로 설명한다.","deep":"<p>대표가 데이터 중요성을 강조한다고 “데이터가 무조건 모델보다 중요합니다”라고 말하면 단순 동조로 들릴 수 있다. <strong>정밀 조작에서는 접촉·시간·행동 데이터가 현재 병목인 경우가 많지만, 정보가 없는 모델 구조도 필요하다<\/strong>는 식으로 균형 있게 설명하는 게 낫다.<\/p><p>같은 논리로 하드웨어가 상품화될 수 있다고 해도 촉각·내구성·센서 품질의 물리적 상한은 존재한다고 인정한다.<\/p>","limit":"대표의 미래 예측을 확정된 산업 규칙으로 받아들이면 반례 질문에 취약해진다.","apply":"“저는 데이터의 양보다 실제 모델 적응과 배포를 빠르게 만드는 유효 데이터의 가치를 중요하게 보고 있습니다.”","refs":["dn26","rldx","career"],"terms":["Hypothesis Testing"]},{"title":"3분 답변은 산업→회사→직무 순서","one":"한 주제에 너무 깊게 빠지기보다 왜 이 업무를 하고 싶은지 구조를 보여줘야 한다.","deep":"<p><strong>① 산업:<\/strong> 정형화되지 않은 접촉 작업은 아직 자동화가 어렵다.<br><strong>② 기업:<\/strong> 리얼월드는 정밀 조작과 산업 현장 데이터로 이 문제를 푼다.<br><strong>③ 역할:<\/strong> 손·물체 행동을 신뢰 가능한 데이터로 만들고 새로운 환경 적응 비용을 줄인다.<br><strong>④ 방법:<\/strong> 시공간 캘리브레이션, 물리 타당성 검증, QA, 재학습 피드백을 통합한다.<\/p>","limit":"자신이 해보지 않은 기술을 해봤다고 말하지 말 것. 지원 직무의 실제 범위는 내부 JD 확인이 필요하다.","apply":"“저의 경험 중 ○○ 프로젝트에서 병목을 분리하고 검증한 방식이 여기에도 도움이 될 것 같습니다.”","refs":["rldx","datajob","dn26"],"terms":["Storytelling","Ownership"]},{"title":"질문할 수 있는 전략적 질문","one":"입사 1년의 기술적 성공 기준, 현재 데이터 병목, 고객별 재사용성이 핵심이다.","deep":"<p><strong>Q1:<\/strong> Hand Data Pipeline에서 가장 큰 병목이 수집, 3D 복원, retargeting, 데이터 유효 수율 중 어디인가요?<br><strong>Q2:<\/strong> 고객사마다 다른 로봇 손으로 데이터를 전환할 때 가장 많은 엔지니어링 시간을 쓰는 단계는 어디인가요?<br><strong>Q3:<\/strong> 합류 후 1년 뒤 기대 이상의 성과라면 어떤 변화가 일어나 있어야 할까요?<\/p>","limit":"전략을 심문하듯 묻기보다 실제 기여와 연결된 궁금증으로 질문하는 것이 자연스럽다.","apply":"“말씀해주신 병목을 제가 합류해 어떻게 검증하고 줄일 수 있을지 더 구체적으로 듣고 싶습니다.”","refs":["career","datajob","rldx"],"terms":["Interview"]},{"title":"실무 경험을 꺼내는 가장 좋은 방식","one":"STAR보다 중요한 것은 가설 → 실험 → 반례 → 정량 결과 → 배운 점이다.","deep":"<p>면접 전에 본인 프로젝트 하나를 골라 다음 질문에 답하도록 준비한다: 무엇이 실제 병목이었나? 어떤 대안을 버렸나? 무엇을 측정했나? 개선 효과는 재현됐나? 팀과 고객에게 어떤 영향이 있었나?<\/p><p>숫자가 없다면 억지로 만들지 말고 실패율, latency, bug 재발 빈도, 운영 시간 등 관찰 가능했던 지표를 명확히 설명하면 된다.<\/p>","limit":"열심히 했다는 의지나 임팩트가 컸다는 표현만으로는 엔지니어링 역량을 평가하기 어렵다.","apply":"“문제가 생겼을 때 먼저 재현하고 분해해 측정하는 습관이 있습니다.”","refs":["career","by25"],"terms":["Ownership","Reproducibility"]}]},{"id":"verify","title":"12 · 검증과 반론 훈련","icon":"🔎","desc":"대표의 주장과 실제 검증된 결과를 명확히 구분","cards":[{"title":"① “완성된 범용 지능”이라는 말은 조심","one":"RLDX-1이 공개되고 일부 벤치마크를 보고한 것은 사실이지만 모든 실제 산업 작업을 수행한다는 뜻은 아니다.","deep":"<p>공식 기술 보고서는 벤치마크 성과와 여러 형태의 로봇 적용을 소개한다. 그러나 실제 고객사 환경에서는 데이터 추가 학습과 운영 안정화가 계속 필요하다. 2026년 10월 CPO도 배포 속도와 환경 적응의 부족을 명시적으로 인정했다.<\/p>","limit":"연구실 SOTA와 상용 안정성·독립 재현은 별도 차원의 검증이다.","apply":"“RLDX-1의 성과를 인정하면서도 실제 배포에서 필요한 속도·일반화·안전 검증은 남아 있다고 이해합니다.”","refs":["rldx","ed26"],"terms":["External Validity"]},{"title":"② “시간당 200데모”는 범위를 봐야 한다","one":"RLDX-1 공개 기술 문서에 보고된 수치이며 외부 독립 조건에서 재현됐다는 증거는 아니다.","deep":"<p>보고서에서는 사람 손 데이터 파이프라인의 4단계(손·물체 추적→3DGS 작업공간 재구성→로봇 retarget→시뮬레이션 rollout)를 설명하며 시간당 200개 이상 데모 생성이 가능하다고 서술한다.<\/p><p>데모마다 작업 난이도, 실패 제외 기준, 유효 라벨 품질이 다르므로 이 숫자만으로 학습 경제성을 평가할 수 없다.<\/p>","limit":"200 demos/h는 회사 보고 수치이며 구매 고객의 생산성이나 모든 작업의 QA 통과율이 아니다.","apply":"“유효데모/시간과 학습 성능 향상/비용으로 같이 보고 싶습니다.”","refs":["rldx"],"terms":["Throughput","Yield"]},{"title":"③ 공개 모델 라이선스는 두 가지다","one":"코드 Apache 2.0과 배포 가중치의 비상업적 라이선스를 구별한다.","deep":"<p>공식 GitHub는 코드가 Apache 2.0이고 모델 체크포인트는 별도 비상업적 RLWRLD Model License라고 명시한다. 이 선택은 상업 사용 계약 가능성과 연결되지만 구체적인 가격이나 라이선스 매출 규모는 확인할 수 없다.<\/p>","limit":"체크포인트 비상업 사용 제한이 곧 상업 계약 체결 수나 금액의 공개 증거는 아니다.","apply":"“모델 라이선싱 가능성을 봤지만 실무 계약 구조는 내부에서 확인해야 한다고 생각합니다.”","refs":["rldxrepo","by25"],"terms":["License","Noncommercial"]},{"title":"④ 고객 협업은 상용 반복 매출과 다르다","one":"MOU·실증·데이터 수집은 실제 활동이지만 반복 구독 매출의 확정 자료는 아니다.","deep":"<p>CJ대한통운 공식 발표는 협업·공동 개발·상용화 추진을 설명하고 있다. AWS 기술 사례에는 롯데호텔 현장 작업 분석과 데이터 수집 협력 등이 소개된다. 다만 실제 운영 규모, 계약 금액, ROI는 공개 자료만으로 검증되지 않는다.<\/p>","limit":"사업성을 평가할 때 고객 로고만으로 매출 규모나 현장 성능을 추정하지 말 것.","apply":"“파트너십을 기술·데이터 측면에서는 강점으로 보지만 사업적 반복 수익은 별도 지표가 필요합니다.”","refs":["cj","aws"],"terms":["MOU","PoC","Revenue"]},{"title":"⑤ 2027년 제품 로드맵은 목표다","one":"RLDX-2의 공개 시기는 발표에 따라 달라졌으며 확정 일정으로 말하지 않는 것이 정확하다.","deep":"<p>9월 발표 보도는 2027년 1월 목표를 다뤘고 10월 CPO 인터뷰에서는 2027년 상반기 공개 전망으로 표현됐다. 손동작 정밀도뿐 아니라 작업 속도·환경 적응 시간·복구 능력 향상이 중요한 방향이다.<\/p>","limit":"계획과 현재 실현된 기능을 동일하게 표현하지 말 것.","apply":"“차세대 모델에서 특히 속도와 adaptation cost를 줄이려는 방향이 이해됩니다.”","refs":["sept26","ed26"],"terms":["Roadmap","Milestone"]}]}],"papers":[{"id":"rldx","name":"RLDX-1 Technical Report","year":"2026","group":"RLWRLD","priority":1,"url":"https://arxiv.org/abs/2605.03269","idea":"Dexterity-first VLA. MSAT로 인지·물리·행동 스트림을 결합하고, motion·memory·force 정보를 지원한다.","method":"Human Data: 손·물체 추적 → 3DGS → 리타게팅 → 시뮬레이션 rollout. Synthetic data와 단계별 학습·배포까지 설명.","result":"시간당 200개 이상 demo 생성, 여러 자체·공개 벤치마크 결과 보고.","caveat":"기업 자체 보고 및 학습/평가 조건에 민감. 고객 현장 독립 검증과 분리.","job":"이 포지션에서 가장 먼저 읽을 기술 문서. 데이터의 시작과 모델 학습의 접점을 파악."},{"id":"huro","name":"HuRo: Robotizing Human Videos for Scalable VLA Pretraining","year":"2026","group":"RLWRLD","priority":1,"url":"https://3587jjh.github.io/HuRo/","idea":"제각각인 사람 영상을 로봇 관측·행동이 정렬된 학습 데이터로 변환하여 대규모 VLA pretraining에 사용.","method":"손 포즈/카메라 추정·언어 annotation → robot retargeting → 사람 제거·로봇 시각 합성.","result":"63만 episode, 1억 4,200만 프레임. 논문 설정의 실제 로봇 4개 작업에서 OOD 개선 보고.","caveat":"연구에 사용한 ALLEX 기반 실험과 다른 하드웨어 일반 성능을 구분.","job":"Human-to-Robot 데이터 변환, 스키마, 대규모 처리, 데이터 다양성의 핵심 논문."},{"id":"hope","name":"HOPE: Hand-Object Pressure Estimation from Monocular Videos","year":"2026","group":"RLWRLD","priority":1,"url":"https://subin6.github.io/page-hope/","idea":"일반 RGB 영상으로 손 mesh vertex별 접촉·압력 추정.","method":"촉각 장갑·평면 압력 센서·접촉 label을 공통 MANO vertex 공간으로 통합하고 영상 Transformer로 시간 변화 학습.","result":"다양한 손-물체 영상으로 접촉·압력 추정의 전이 가능성 보고.","caveat":"모델 예측 압력은 실측 힘·토크와 동등하지 않음; domain shift와 pose 오차 영향.","job":"데이터 레이블 uncertainty, 센서 없는 접촉 추론, 물리적 타당성을 이해하기 좋음."},{"id":"pointwam","name":"PointWAM: 3D World Action Modeling for Dexterous Robotic Manipulation","year":"2026","group":"RLWRLD","priority":1,"url":"https://chrockey.github.io/PointWAM/","idea":"장면과 손의 미래를 공통 3D point trajectory 공간에서 예측 후 로봇 행동으로 연결.","method":"인간 영상 대규모 pretrain 후 로봇 fine-tune, scene+hand trajectory를 함께 예측.","result":"DexJoCo 10개 조작 작업에서 평균 69.0% 성공률(연구 조건).","caveat":"벤치마크/개별 로봇 성공률을 전체 범용성으로 확대하지 말 것.","job":"geometry·temporal consistency·retargeting이 모델 일반화에 중요한 이유."},{"id":"autodex","name":"AutoDex: An Automated Real-World System for Dexterous Grasping Data Collection","year":"2026","group":"RLWRLD","priority":1,"url":"https://arxiv.org/abs/2606.23689","idea":"실물 로봇이 자동으로 grasp 후보를 수행·성공/실패 검증·리셋하는 수집 루프.","method":"20카메라 인식, collision-aware motion, 물체 재배치, lift/hold 성공 라벨.","result":"연구 조건에서 텔레오퍼레이션 대비 수집 처리량 4.8배 보고.","caveat":"논문/프로젝트 사이트의 수집 trial 집계 버전 차이가 있어 수치 비교 시 실험 버전을 확인.","job":"양보다 실제 물리적으로 검증된 label이 왜 가치 있는지 알려준다."},{"id":"pose6d","name":"Pose6DAug: Physically Plausible Multi-view Object Swapping","year":"2026","group":"RLWRLD","priority":2,"url":"https://arxiv.org/abs/2606.20118","idea":"성공한 조작 episode의 action을 보존하면서 조작 물체를 3D에서 바꿔 OOD 데이터를 생성.","method":"다중 카메라의 6D pose와 물체 mesh로 뷰 간 일관성 유지.","result":"논문 설정에서 새 물체에 대한 성공률 개선 보고.","caveat":"물체 치환이 항상 같은 grasp trajectory의 물리적 성공을 보장하지 않음.","job":"물리적으로 일관된 데이터 증강과 failure-driven 학습의 중요성."},{"id":"rofacto","name":"RoFacto: Robot-Factored World Models via Robot Rendering","year":"2026","group":"RLWRLD","priority":2,"url":"https://arxiv.org/abs/2607.22535","idea":"로봇의 action 실현/렌더링과 장면의 물리적 반응 모델링을 분리.","method":"로봇 controller+kinematics 결과를 렌더링해 다른 morphology의 정보를 공통 visual interface로 제공.","result":"논문 설정에서 다른 로봇으로의 일반화 개선 보고.","caveat":"예측 영상의 품질이 곧 안전한 현실 행동 제어를 보장하지는 않음.","job":"robot-specific 요인과 transferable world dynamics를 분리하는 사고."},{"id":"vpm","name":"Learning the 4D World through Point Trajectory Forecasting (VPM)","year":"2026","group":"RLWRLD","priority":2,"url":"https://arxiv.org/abs/2610.28594","idea":"다중뷰 영상에서 공통 3D point trajectory와 미래 프레임을 함께 예측.","method":"카메라 조건과 point supervision을 통해 시점 간 일관성을 향상, action token으로 제어까지 확장.","result":"논문에서 예측 지표 및 시뮬레이션·실물 조작 개선 보고.","caveat":"미래 영상 생성 결과와 안전성·현장 안정성은 별도의 검증.","job":"멀티뷰 캘리브레이션, scene tracking, temporal alignment와 직결."},{"id":"umi","name":"UMI — Universal Manipulation Interface","year":"2024","group":"핵심 선행연구","priority":1,"url":"https://arxiv.org/abs/2402.10329","idea":"로봇 없이 현장에서 사람의 그리퍼 기반 조작 시연을 수집하고 정책으로 이전.","method":"휴대형 gripper, 시간 지연 matching, relative trajectory representation.","result":"동적·양손 작업과 다른 환경에서의 transfer 가능성 검증.","caveat":"기본 구조는 주로 그리퍼이며 고자유도 맨손 문제를 그대로 해결하지 않음.","job":"왜 사람 데이터를 모으는 것만이 아니라 robot action interface가 중요하지 이해."},{"id":"dexumi","name":"DexUMI — Human Hand as Universal Manipulation Interface","year":"2025","group":"핵심 선행연구","priority":1,"url":"https://arxiv.org/abs/2505.21864","idea":"인간 손의 조작 능력을 다양한 5지 로봇 손에 전이.","method":"착용형 외골격·촉각 피드백으로 kinematic gap 완화, 영상 내 손을 로봇 손으로 inpainting.","result":"두 로봇 손 플랫폼에서 평균 86% 성공률 보고(논문 조건).","caveat":"착용 장치의 제약·로봇별 기구학 차이와 사용자 부담 존재.","job":"RLDX의 맨손 수집·소프트웨어 리타게팅과 비교하기 좋은 논문."},{"id":"openx","name":"Open X-Embodiment / RT-X","year":"2023","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2310.08864","idea":"다양한 로봇의 데이터 포맷을 통합해 교차 로봇 학습 가능성 실험.","method":"여러 기관·로봇 데이터를 표준화하여 공통 policy 학습.","result":"공개 논문에서 cross-robot positive transfer를 보고.","caveat":"데이터 분포가 특정 로봇에 편중될 수 있고 모든 손 형태를 다루지 않음.","job":"공통 행동 표현·schema 설계와 embodiment bias의 근거."},{"id":"droid","name":"DROID — A Large-Scale In-The-Wild Robot Dataset","year":"2024","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2403.12945","idea":"작업·장면·수집자를 늘려 로봇 데이터의 환경 다양성 확보.","method":"50명의 수집자, 564개 장면, 84개 작업에서 7.6만 trajectories.","result":"다양한 환경 데이터가 정책 일반화에 도움을 준다고 보고.","caveat":"단일 로봇 형태 중심의 데이터 특성이 남을 수 있다.","job":"데이터 양보다 diversity와 실제 환경 범위가 중요한 이유."},{"id":"pi0","name":"π₀ — VLA Flow Model for General Robot Control","year":"2024","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2410.24164","idea":"사전학습 VLM과 flow matching action expert를 결합해 다양한 로봇 조작 수행.","method":"멀티 로봇 데이터 사전학습과 task fine-tune.","result":"빨래 접기·상자 조립 등 복잡한 작업 실험 보고.","caveat":"다른 모델과 성능 비교는 데이터·테스트 조건을 맞춰야 한다.","job":"RLDX-1의 action-generation 전략과 대비하며 모델 architecture를 이해."},{"id":"openvla","name":"OpenVLA — Open-Source Vision-Language-Action","year":"2024","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2406.09246","idea":"7B VLA를 공개하고 로봇 데이터로 fine-tuning 가능한 기반 모델 제공.","method":"인터넷 VLM 표현과 97만 로봇 demonstrations 결합.","result":"다양한 조작 태스크에서 강한 성능 및 저비용 적응 가능성 보고.","caveat":"공개 모델이라고 모든 실세계 손 작업에 바로 적합하진 않음.","job":"모델 상품화 위험과 전문 데이터의 필요성 논의에 유용."},{"id":"diff","name":"Diffusion Policy — Visuomotor Policy via Action Diffusion","year":"2023","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2303.04137","idea":"행동의 여러 가능한 해법을 diffusion distribution으로 모델링.","method":"조건부 denoising + action chunk + receding horizon control.","result":"복수 조작 벤치마크에서 이전 접근 대비 개선 보고.","caveat":"반복 추론 비용과 고속 제어 요구를 함께 고려해야 한다.","job":"시간축 action label·trajectory quality가 왜 중요한지 연결."},{"id":"act","name":"ACT — Action Chunking with Transformers","year":"2023","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2304.13705","idea":"짧은 demonstration으로 정밀 양손 조작을 배우기 위한 action chunking.","method":"저비용 양팔 텔레오퍼레이션+Transformer action sequence generation.","result":"논문에서 6개 정밀 조작 task, 일부 80~90% 성공률 보고.","caveat":"다양한 작업에 대한 범용 프리트레인 모델 자체는 아니다.","job":"action window, chunk alignment, temporal compression 이해."},{"id":"rt2","name":"RT-2 — VLM to VLA","year":"2023","group":"핵심 선행연구","priority":3,"url":"https://arxiv.org/abs/2307.15818","idea":"웹 지식과 로봇 행동 학습을 함께 학습하여 상징적 일반화를 물리 행동에 연결.","method":"로봇 행동을 토큰으로 표시해 VLM과 함께 학습.","result":"새 명령·물체·의미 기반 선택에 대한 일반화 보고.","caveat":"접촉 기반 고자유도 손의 정확한 힘 제어 문제를 모두 해결하지 않음.","job":"LLM 지식이 로봇에 주는 장점과 한계를 설명하기 좋음."},{"id":"3dgs","name":"3D Gaussian Splatting","year":"2023","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/2308.04079","idea":"장면을 3D Gaussian으로 표현해 빠른 신시점 렌더링.","method":"다중 이미지와 camera calibration을 이용해 Gaussian 위치·크기·색 최적화.","result":"실시간 신시점 렌더링 가능성을 보여줌.","caveat":"힘·토크를 추정하는 수단이 아니라 기하/장면 표현 기술.","job":"RLDX-1 Human Data Pipeline의 workspace reconstruction을 이해."},{"id":"dagger","name":"DAgger — Dataset Aggregation","year":"2011","group":"핵심 선행연구","priority":2,"url":"https://arxiv.org/abs/1011.0686","idea":"모델이 실제 방문하는 상태에서 전문가의 교정 행동을 모아 재학습.","method":"정책 실행 → 실패/방문 상태 전문가 라벨 → 데이터 병합 반복.","result":"순차 행동의 distribution shift 문제를 이론·실험으로 다룸.","caveat":"사람 교정 비용 및 안전한 실행 환경이 필요.","job":"Deploy First의 실패 피드백 루프를 학습 알고리즘과 연결."}],"evidence":[{"date":"2025.05","title":"큰 목표에서 거꾸로 역산하는 방식","claim":"10~20년 뒤의 큰 그림을 먼저 그린 다음 필요한 인재·데이터·자원을 역산하고 실행하라고 강조.","meaning":"기술 스펙보다 궁극적 해결 문제를 먼저 정의하는 접근으로 읽힌다.","test":"대표가 이렇게 말한 것은 확인되지만 개별 엔지니어 면접 질문·채점 기준은 미확인.","status":"대표 직접 인터뷰","refs":["by25a"]},{"date":"2025.05","title":"데이터엔 골든룰이 없지만 시행착오 비용은 있다","claim":"로봇 데이터 수집의 정답이 아직 정해지지 않아 제한된 자원 안에서 실험을 설계해야 한다고 설명.","meaning":"데이터 종류·비용·downstream 효과를 빠르게 검증할 실험 플랫폼의 중요성.","test":"특정 수집 방식이 무조건 우월하다고 추정할 근거는 없다.","status":"대표 직접 인터뷰","refs":["by25a","by25"]},{"date":"2025.05","title":"API로 선택받는 로봇 지능","claim":"다른 로봇 개발자가 필요할 때 리얼월드 RFM을 API로 선택하는 사업을 지향.","meaning":"하드웨어를 직접 대량 생산하지 않는 소프트웨어 공급자 포지션.","test":"공개 가격·유료 라이선스 고객 수는 확인되지 않음.","status":"대표 직접 발언","refs":["by25"]},{"date":"2025.05","title":"승자는 엔지니어링","claim":"GPU 물량만 늘리기보다 모델 효율과 실시간 엣지 추론을 중요하게 본다고 설명.","meaning":"효율적인 데이터 엔진·latency·산업 배포에 기술 자원이 집중될 수 있다.","test":"실제 비용 효율 우위는 동등 실험과 운영 수치 검증이 필요.","status":"대표 직접 발언","refs":["by25"]},{"date":"2025.05","title":"진짜 난제는 데이터 확보","claim":"로봇 액션 레이블이 부족하고 원격조작·사람 영상·시뮬레이션을 실험 중이라고 설명.","meaning":"Hand Data Pipeline이 전략 핵심과 직접 연결.","test":"어느 데이터 원천이 가장 유용한지는 작업·모델별 실험 문제.","status":"대표 직접 발언","refs":["by25"]},{"date":"2026.05","title":"RLDX-1 공개","claim":"정밀 조작용 VLA, 사람 데이터·MSAT·물리 감각 모델을 공개.","meaning":"전략이 코드와 모델 기술 문서로 일부 구체화.","test":"자체 평가와 고객 실운영 성능·독립 재현은 별개.","status":"회사 기술 발표","refs":["rldx","rldxrepo"]},{"date":"2026.06","title":"DexBench: 비교 가능한 평가","claim":"서로 다른 기업의 로봇 성공률을 동일 조건으로 비교하기 어렵다고 지적.","meaning":"평가와 데이터 인터페이스를 표준화해 생태계 참여를 촉진하려는 가설.","test":"협업 발표가 곧 업계 표준의 광범위 채택은 아님.","status":"대표 직접 인터뷰","refs":["nd26","dexbench"]},{"date":"2026.08","title":"기반 모델 소유","claim":"상위 기반 모델이 응용 기술을 흡수할 수 있어 RFM을 직접 개발한다고 설명.","meaning":"모델 layer의 소유와 장기 협상력을 중시.","test":"모델 독자 개발 = 가격 결정력 확보는 아직 별도 가설.","status":"대표 직접 인터뷰","refs":["bell26"]},{"date":"2026.08","title":"Deploy First","claim":"현장에 먼저 배포하고 코너 케이스 데이터를 다시 학습에 활용.","meaning":"연구와 배포 사이클을 짧게 돌리려는 운영 철학.","test":"배포·수집·재학습이 실제로 고객당 도입 비용을 줄였는지 검증 필요.","status":"대표 직접 인터뷰","refs":["dn26"]},{"date":"2026.08","title":"전문 데이터가 양보다 중요","claim":"대량의 평범한 시연보다 산업 현장 고숙련 데이터의 가치를 강조.","meaning":"데이터 품질·정보량·학습 유효성에 투자.","test":"어떤 품질 기준이 실제 model uplift를 만드는지 ablation 필요.","status":"대표 직접 인터뷰","refs":["dn26"]},{"date":"2026.08","title":"하드웨어의 범용화 전망","claim":"하드웨어 부품의 표준화가 진전되고 모델 회사가 생태계 조정자가 될 것으로 전망.","meaning":"장기적으로 지능/데이터/배포 layer의 가치가 커질 수 있다.","test":"예측일 뿐이며 하드웨어 물리적 차별화는 지속 가능.","status":"대표의 미래 전망","refs":["dn26"]},{"date":"2026.09","title":"서비스형 로봇 노동","claim":"AI 소프트웨어 구독과 하드웨어 임대를 결합한 월 단위 서비스 구상.","meaning":"순수 모델 라이선스에서 실제 작업 가치로 수익화 확장.","test":"상용 계약·순이익·현장 ROI는 공개 증거로 확인되지 않음.","status":"대표 현장 발표","refs":["i26"]},{"date":"2026.09","title":"CJ와 공동 개발·현장 적용","claim":"물류 특화 모델의 공동 개발과 상용화를 위한 협약을 발표.","meaning":"산업 현장 접근·데이터 파트너십의 구체적 사례.","test":"MOU와 반복 구독 매출을 구분.","status":"고객사 공식 발표","refs":["cj"]},{"date":"2026.10","title":"속도·재시도·환경 적응이 중요","claim":"RLDX-2는 느린 작업 속도, 새로운 환경 적응 시간, 복구 능력을 개선하려 한다.","meaning":"높은 벤치마크 성능만으로 부족하다는 내부 인식.","test":"류중희 직접 발언이 아니라 류형규 CPO 인터뷰.","status":"회사 임원 인터뷰","refs":["ed26"]},{"date":"2026.11","title":"새로운 연구 포트폴리오","claim":"공식 연구 목록에 HuRo·HOPE·PointWAM·AutoDex·VPM 등이 게시.","meaning":"데이터·물리 표현·3D 월드모델·자동 수집으로 투자 영역 확장.","test":"공동연구·논문 실험 결과를 회사 상용 기능으로 동일시하지 말 것.","status":"공식 연구 목록","refs":["res"]}],"glossary":[{"cat":"모델","title":"RFM","definition":"Robotics Foundation Model. 다양한 로봇·작업에 재사용될 수 있는 사전학습 모델.","trap":"범용이라는 이름이 모든 로봇에서 제로샷 성공을 보장하지는 않는다."},{"cat":"모델","title":"VLA","definition":"Vision-Language-Action. 영상과 언어 조건을 받고 로봇 행동을 생성하는 모델.","trap":"언어 이해 성능과 접촉 제어 성능은 다르다."},{"cat":"모델","title":"VLM","definition":"Vision-Language Model. 이미지와 텍스트를 함께 처리하는 모델.","trap":"VLM만으로 로봇 제어 신호가 완성되는 것은 아니다."},{"cat":"모델","title":"Policy","definition":"현재 관측과 목표를 행동으로 연결하는 로봇 제어 함수.","trap":"정책의 offline loss가 실제 success rate를 보장하지 않는다."},{"cat":"모델","title":"MSAT","definition":"Multi-Stream Action Transformer. RLDX-1의 인지·물리·행동 스트림 통합 구조.","trap":"타사 모델의 동등한 내부 구조로 오해하지 말자."},{"cat":"모델","title":"Action Chunk","definition":"한 번에 예측하는 연속된 행동 구간.","trap":"chunk가 길면 지연은 줄지만 반응성이 약해질 수 있다."},{"cat":"모델","title":"Diffusion Policy","definition":"노이즈 제거 과정을 통해 행동 분포를 생성하는 학습 방식.","trap":"여러 번의 denoising 추론에 계산 비용이 든다."},{"cat":"모델","title":"Flow Matching","definition":"노이즈 분포에서 데이터 분포까지의 흐름을 학습해 연속 행동을 생성하는 방식.","trap":"flow matching이라는 사실만으로 모든 행동이 안정적이지 않다."},{"cat":"모델","title":"Pretraining","definition":"여러 데이터로 모델의 일반 표현을 먼저 학습하는 단계.","trap":"pretraining 데이터 분포가 모든 실제 작업을 대표하지 않는다."},{"cat":"모델","title":"Fine-tuning","definition":"사전학습 모델을 특정 작업·환경·로봇에 추가 학습하는 단계.","trap":"모델 업데이트마다 안전성과 성능 재검증이 필요하다."},{"cat":"모델","title":"Cross-Embodiment","definition":"다른 로봇 하드웨어에서 배운 능력을 이전·적응하는 것.","trap":"형태가 다르면 행동 표현과 물리 제약이 달라진다."},{"cat":"모델","title":"World Model","definition":"행동에 따라 세계 상태가 어떻게 바뀔지 예측하는 모델.","trap":"좋은 예측 영상과 안전한 제어 성능은 다르다."},{"cat":"모델","title":"OOD","definition":"Out-of-Distribution. 학습 데이터 분포 바깥의 장면·물체·작업.","trap":"OOD는 하나의 숫자가 아니라 어떤 변화를 주었는지 명시해야 한다."},{"cat":"모델","title":"DAgger","definition":"정책이 실제 방문한 상태를 전문가가 교정해 학습하는 dataset aggregation.","trap":"안전한 시연·전문가 교정이 필요하다."},{"cat":"모델","title":"Generalization","definition":"처음 보지 않은 환경·물체·작업에서도 성능을 유지하는 능력.","trap":"새 물체와 새 로봇으로의 일반화는 서로 다른 문제다."},{"cat":"로봇·물리","title":"Dexterity","definition":"다양한 물체를 정밀하고 유연하게 다루는 손재주.","trap":"손가락이 다섯 개라는 이유만으로 Dexterity가 생기지 않는다."},{"cat":"로봇·물리","title":"DoF","definition":"Degrees of Freedom. 독립적으로 움직일 수 있는 자유도.","trap":"자유도가 많아도 실제 구동·센서 품질이 낮으면 성능 제한."},{"cat":"로봇·물리","title":"Embodiment","definition":"로봇 몸체의 기구학적·센서·행동 구성.","trap":"소프트웨어적으로 공통화해도 물리 차이는 남는다."},{"cat":"로봇·물리","title":"Retargeting","definition":"사람 동작을 로봇의 실제 가능한 행동으로 변환하는 과정.","trap":"관절각 단순 복사는 접촉·작업 목적을 보존하지 못할 수 있다."},{"cat":"로봇·물리","title":"IK","definition":"Inverse Kinematics. 목표 손끝/포즈에서 관절각을 계산.","trap":"동일한 목표에도 여러 해가 있으며 관절 제한이 중요하다."},{"cat":"로봇·물리","title":"FK","definition":"Forward Kinematics. 관절값으로 말단 위치와 자세 계산.","trap":"캘리브레이션 오차가 있으면 실제 위치와 어긋날 수 있다."},{"cat":"로봇·물리","title":"6D Pose","definition":"물체·카메라·손의 3D 위치 3개 + 회전 3개를 뜻하는 표현.","trap":"대칭 물체는 pose가 다의적으로 보일 수 있다."},{"cat":"로봇·물리","title":"Contact-rich","definition":"지속적인 접촉·힘·미끄러짐이 결과에 큰 영향을 주는 작업.","trap":"이미지만으로 정확한 물리 상호작용 레이블 확보가 어려움."},{"cat":"로봇·물리","title":"Proprioception","definition":"로봇 관절각·속도·내부 상태 등 자신의 몸 상태 감각.","trap":"외부 물체 상태를 직접 알려주는 것은 아니다."},{"cat":"로봇·물리","title":"Force/Torque","definition":"선형 힘과 회전력 신호.","trap":"장비별 좌표계·교정·단위가 필수."},{"cat":"로봇·물리","title":"Tactile Sensor","definition":"손 표면의 접촉/압력 등을 측정하는 센서.","trap":"센서 위치와 샘플링 차이가 데이터 호환성에 영향을 준다."},{"cat":"로봇·물리","title":"Sim-to-Real","definition":"시뮬레이션에서 학습한 능력을 실세계에 적용하는 문제.","trap":"접촉·마찰·관절 제어 차이로 gap이 발생한다."},{"cat":"로봇·물리","title":"Digital Twin","definition":"현실 장비·환경을 가상 공간에 표현하는 기술.","trap":"정밀도가 높다고 실물 물리량을 모두 재현하는 것은 아니다."},{"cat":"로봇·물리","title":"3DGS","definition":"3D Gaussian Splatting. 3D Gaussian으로 장면을 표현하고 신시점 렌더링.","trap":"압력·토크를 측정하는 방법은 아니다."},{"cat":"로봇·물리","title":"MANO","definition":"3D 사람 손의 형상·포즈를 나타내는 파라메트릭 mesh 모델.","trap":"실제 손의 모든 압력·연부조직 특성을 표현하지 못한다."},{"cat":"로봇·물리","title":"Occlusion","definition":"관측 물체가 다른 물체/손가락에 가려 보이지 않는 현상.","trap":"오른쪽 손가락이 가려졌는데 정확한 pose로 간주하면 위험."},{"cat":"로봇·물리","title":"Contact Map","definition":"손 표면 어느 위치가 물체와 접촉하는지 나타내는 표현.","trap":"접촉 유무와 압력 크기는 별도 정보다."},{"cat":"데이터·인프라","title":"4D+","definition":"3D 공간 + 시간 + 물리적 상호작용 등 추가 신호를 통합하는 리얼월드의 표현.","trap":"회사 표현으로 모든 회사가 동일 스키마를 사용하는 것은 아니다."},{"cat":"데이터·인프라","title":"Episode","definition":"연속된 하나의 작업 시연·실행 단위.","trap":"시작/종료 정의가 불명확하면 데이터 수가 부풀려질 수 있다."},{"cat":"데이터·인프라","title":"Demonstration","definition":"사람·로봇·시뮬레이션이 보여준 행동 궤적.","trap":"데모 수는 품질·다양성·학습 유효성과 다르다."},{"cat":"데이터·인프라","title":"Time Sync","definition":"센서·프레임의 시간 기준을 맞추는 과정.","trap":"단순 파일 timestamp 정렬은 clock drift를 놓칠 수 있다."},{"cat":"데이터·인프라","title":"Extrinsic Calibration","definition":"카메라와 로봇/월드 좌표계 사이의 변환 추정.","trap":"설비 이동 뒤 drift 재검증이 필요하다."},{"cat":"데이터·인프라","title":"Intrinsic Calibration","definition":"렌즈·초점·왜곡 등 카메라 내부 파라미터 추정.","trap":"장면 재투영 오차는 extrinsic과 함께 진단해야 한다."},{"cat":"데이터·인프라","title":"Data Provenance","definition":"원본·변환·추정·수집 권한의 계보 정보.","trap":"추정 힘 데이터를 센서 실측으로 잘못 해석하지 않도록 한다."},{"cat":"데이터·인프라","title":"Data Lineage","definition":"학습 데이터가 어떤 원본과 처리 코드에서 왔는지 추적.","trap":"실험 재현에는 파라미터와 버전도 포함."},{"cat":"데이터·인프라","title":"Data Drift","definition":"시간에 따라 데이터 분포가 변화하는 현상.","trap":"모든 drift가 악화는 아니며 새로운 도메인일 수 있다."},{"cat":"데이터·인프라","title":"MCAP","definition":"ROS 등 멀티모달 로봇 로그를 담을 수 있는 컨테이너 포맷.","trap":"학습 메타데이터 분석에 최적화된 파일 포맷과는 다르다."},{"cat":"데이터·인프라","title":"Parquet","definition":"컬럼 지향 저장 포맷. 대규모 메타데이터 분석에 유용.","trap":"압축 영상이나 원시 센서 전체 저장에 항상 최적은 아니다."},{"cat":"데이터·인프라","title":"S3","definition":"클라우드 오브젝트 스토리지. 원본·중간 데이터 내구성 확보에 사용.","trap":"많은 작은 파일 random read가 GPU 학습에서 병목일 수 있다."},{"cat":"데이터·인프라","title":"FSx for Lustre","definition":"AWS 고성능 병렬 공유 파일시스템. 학습 데이터 고속 접근에 사용.","trap":"비용·데이터 이동 관리가 중요하다."},{"cat":"데이터·인프라","title":"Sharding","definition":"큰 데이터셋을 접근·처리 효율 좋은 조각으로 분할.","trap":"shard가 너무 크거나 작으면 shuffle과 I/O가 악화된다."},{"cat":"데이터·인프라","title":"Idempotency","definition":"처리를 여러 번 실행해도 결과가 중복·오염되지 않는 성질.","trap":"장애 복구 시 데이터 중복 방지에 필수."},{"cat":"데이터·인프라","title":"Throughput","definition":"단위 시간에 처리한 데이터 또는 작업의 양.","trap":"처리량이 유효 데모 수와 동일하지 않다."},{"cat":"데이터·인프라","title":"Latency","definition":"한 요청·데이터가 처리되는 데 드는 시간.","trap":"평균 외 p95/p99 지연도 중요."},{"cat":"데이터·인프라","title":"Ablation","definition":"한 요소만 바꾸는 실험으로 성능 기여도를 분리하는 방법.","trap":"평가/학습 조건 고정이 핵심."},{"cat":"데이터·인프라","title":"Valid Yield","definition":"모든 수집 데이터 중 유효 판정을 받은 데이터의 비율.","trap":"QA 통과가 곧 model improvement를 보장하지 않는다."},{"cat":"사업·전략","title":"Deploy First","definition":"고객 현장에 빠르게 실증·배포하고 실패 데이터로 모델을 개선하는 전략.","trap":"안전 검증 없이 모델을 설치한다는 의미가 아니다."},{"cat":"사업·전략","title":"Data Flywheel","definition":"배포→데이터→모델 개선→배포 확대의 자기 강화 구조.","trap":"데이터 규모만 늘어나면 플라이휠이라 할 수 없다."},{"cat":"사업·전략","title":"Data Moat","definition":"타사가 쉽게 접근·복제·재사용할 수 없는 데이터 기반 경쟁력.","trap":"희소함만으로 모델 성능 우위 보장이 없다."},{"cat":"사업·전략","title":"Winner-take-most","definition":"소수 강자에게 시장가치가 집중되지만 다른 기업도 존속하는 구조.","trap":"규모의 경제와 고객 전환 비용을 검증해야 한다."},{"cat":"사업·전략","title":"Vendor Lock-in","definition":"기술·표준·운영 과정이 연결되어 공급자 교체가 어려워지는 현상.","trap":"고객이 싫어하는 과도한 잠금은 성장에 불리할 수 있다."},{"cat":"사업·전략","title":"RaaS","definition":"Robot-as-a-Service. 로봇 하드웨어·소프트웨어·운영을 서비스로 공급.","trap":"구독 매출이 소프트웨어 마진을 자동 보장하지 않는다."},{"cat":"사업·전략","title":"RX","definition":"Robotics Transformation. 고객 현장 작업을 조사·분해하고 자동화 ROI를 평가.","trap":"회사별 프로젝트 형태가 다를 수 있다."},{"cat":"사업·전략","title":"RD","definition":"Robotics Deployment. PoC부터 실제 배포로 연결하는 활동.","trap":"실증과 대규모 상용 운영은 구분."},{"cat":"사업·전략","title":"PoC","definition":"Proof of Concept. 기술·경제성의 초기 실증.","trap":"MOU와 PoC와 유료 계약은 각각 다르다."},{"cat":"사업·전략","title":"TCO","definition":"Total Cost of Ownership. 장비와 운영·장애·재작업 등 전체 비용.","trap":"구매가격만 비교하면 도입 경제성을 놓친다."},{"cat":"사업·전략","title":"ROI","definition":"Return on Investment. 투자 대비 얻는 가치.","trap":"로봇 성공률만으로 ROI는 계산되지 않는다."},{"cat":"사업·전략","title":"Adaptation Cost","definition":"새 작업·로봇·현장에 모델을 맞추는 데 필요한 추가 데이터·시간·비용.","trap":"범용성을 검증하는 실질적 사업 지표."},{"cat":"사업·전략","title":"DexBench","definition":"리얼월드가 제안한 정밀 조작 능력 평가·데이터 표준화 이니셔티브.","trap":"협력이 발표됐어도 업계 표준 채택은 별도 검증해야 한다."}],"alignment":[{"title":"파운데이션 모델을 직접 소유해야 한다","proposition":"범용 로봇 지능의 핵심 모델을 자체 개발해야 높은 장기 협상력을 얻을 수 있다.","ceo":"대표는 2026년 8월 상위 모델이 응용 기술을 흡수할 수 있다는 위험을 설명했다.","condition":"하지만 공개 모델의 성능이 비슷해지면 소유만으로 경제적 지배력은 생기지 않는다. 실제 고객 적용비용·기술 우위·사용권이 중요하다.","voice":"“모델 소유는 출발점이지만, 고객의 실제 작업에서 차별적인 성능과 재사용 비용 감소를 증명해야 사업적 가치가 생긴다고 봅니다.”","refs":["bell26","by25"]},{"title":"완벽한 모델보다 현장 배포를 먼저 한다","proposition":"Deploy First로 실제 실패를 빠르게 발견하고 다시 데이터·학습에 반영해야 한다.","ceo":"대표의 2026년 8월 직접 인터뷰에서 나온 실행 전략이다.","condition":"안전 검증이 먼저 필요한 작업에서는 무리한 조기 배포가 역효과다. 통제된 PoC, 운영·재학습 연결 속도 개선이 핵심이다.","voice":"“현장에서만 발견되는 예외를 빠르게 학습에 반영할 수 있도록 데이터 파이프라인의 리드타임을 줄이는 일이 중요하다고 생각합니다.”","refs":["dn26"]},{"title":"데이터의 양보다 학습 유용성이 중요하다","proposition":"손-물체 상호작용의 질과 검증이 단순 데모 수보다 더 중요한 병목일 수 있다.","ceo":"대표는 산업 현장 숙련 데이터와 품질의 중요성을 반복적으로 강조해 왔다.","condition":"양과 질은 대립만 하는 것이 아니다. 먼저 데이터 coverage와 접촉/힘 레이블의 observability를 측정하고 ablation으로 기여도를 확인해야 한다.","voice":"“수집량뿐 아니라 실제로 학습 가능한 데이터 수율과 downstream task uplift를 함께 개선하겠습니다.”","refs":["dn26","rldx"]},{"title":"하드웨어 일부는 범용재가 될 것이다","proposition":"표준화된 로봇 팔·부품이 늘수록 지능과 데이터의 협상력이 커질 수 있다.","ceo":"대표는 2026년 8월 하드웨어의 상품화 가능성을 미래 전망으로 설명했다.","condition":"특수 손·촉각·구동기·내구성은 여전히 진입장벽일 수 있다. 작업별 최적 그리퍼가 다르므로 하드웨어 무용론으로 과장하지 말 것.","voice":"“표준화가 가능한 부품과 실제 접촉 성능을 결정하는 특수 하드웨어를 구분해서 보겠습니다.”","refs":["dn26","rldx"]},{"title":"범용 모델의 진짜 가치는 낮은 적응 비용","proposition":"여러 로봇·현장에 적용하는 과정이 반복될수록 싸지고 빨라져야 플랫폼 경제성이 성립한다.","ceo":"모델의 하드웨어 비종속성과 산업별 장기 파트너십은 회사의 공개 전략이다.","condition":"모든 로봇에서 제로샷 성공이 보장되는 것은 아니다. New Embodiment Onboarding Time과 Adaptation Data Requirement를 측정해야 한다.","voice":"“핵심은 교차 로봇 일반화 자체를 주장하는 것보다, 새로운 하드웨어에 적용할 때 필요한 비용과 데이터를 얼마나 줄였는지 입증하는 것입니다.”","refs":["rldx","aws"]},{"title":"모델 API를 넘어 노동력 서비스까지 확장","proposition":"장기적으로 고객은 로봇 지능보다 성공적으로 완료된 작업에 돈을 지불한다.","ceo":"2025년 API 구상과 2026년 9월 하드웨어 임대+AI 구독 구상을 순차적으로 발표했다.","condition":"RaaS는 반복 매출이지만 장비 감가상각과 운영 리스크가 있어 반드시 고마진은 아니다. 상용 계약 규모도 공개 자료로 확정되지 않는다.","voice":"“모델 구독료가 아니라 성공 작업당 총비용을 고객 지표로 연결해야 장기 사업성까지 설명할 수 있다고 봅니다.”","refs":["by25","i26"]},{"title":"한국·일본은 실제 데이터의 출발점이다","proposition":"한국의 첨단 제조 현장과 일본의 현지 서비스 자동화 수요를 산업 데이터 경쟁력으로 전환할 수 있다.","ceo":"대표는 숙련된 현장 데이터와 장소를 옮길 수 없는 서비스업 수요를 강조했다.","condition":"산업용 로봇 밀도와 학습 데이터의 품질은 별개다. 고객 데이터 사용권, 현장 접근, 개인정보 보호, 재사용 가능한 학습 신호가 조건이다.","voice":"“한국의 강점은 로봇 보유대수 자체보다 현장 경험을 모델이 배우는 형태로 전환하고 검증할 수 있는 접근성에 있다고 봅니다.”","refs":["dn26","ifrobot"]},{"title":"데이터 시스템은 연구를 배포 성과로 이어야 한다","proposition":"Hand Data Pipeline의 가치는 처리량뿐 아니라 모델 실패 감소와 신규 현장 도입 비용 절감으로 평가해야 한다.","ceo":"Deploy First와 RLDX-1 Human Data 구조, 채용 공고를 결합한 분석이다. 직접 인용이 아니다.","condition":"데이터 엔지니어가 모든 모델 KPI를 직접 소유할 수는 없다. 데이터 품질 지표와 downstream 실험의 인과관계를 연구팀과 공동으로 검증해야 한다.","voice":"“정합성과 재현성 위에, 모델 팀과 함께 데이터 수율 및 다운스트림 학습 효과를 연결하는 파이프라인을 만들고 싶습니다.”","refs":["dn26","rldx","datajob"]},{"title":"평가 표준과 데이터 포맷도 사업 자산이다","proposition":"비교 가능한 정밀 조작 성능 평가가 모델 경쟁뿐 아니라 개발자·고객 생태계 확대에 기여할 수 있다.","ceo":"대표는 2026년 6월 DexBench 협업과 표준 평가 부재를 설명했다.","condition":"공동 개발 발표가 곧 시장 표준의 채택 증거는 아니다. 외부 채택률, 재현성, 독립 평가가 필요하다.","voice":"“RFM 성능을 여러 로봇에서 비교 가능한 조건으로 측정할 때 데이터·모델·하드웨어가 함께 발전할 수 있다고 생각합니다.”","refs":["nd26","dexbench"]}],"quiz":[{"question":"류 대표의 2026년 8월 핵심 실행 전략은?","options":["Deploy First","GPU 규모 우선","하드웨어 완전 내재화","학습 없이 모델 판매"],"answer":0,"explain":"현장 배포로 얻는 실패·코너 케이스 데이터가 다음 학습을 개선하는 루프를 강조했다.","source":"dn26"},{"question":"2025년 5월 리얼월드가 자처한 사업 포지션은?","options":["직접 자동차 제조","모든 로봇에 독점 칩 공급","필요할 때 선택 가능한 RFM API 공급자","로봇 전용 클라우드 저장소"],"answer":2,"explain":"류 대표는 다른 로봇 기업이 필요에 따라 API를 활용하는 모델을 설명했다.","source":"by25"},{"question":"2025년 산업용 로봇 신규 설치 60.3만 대가 의미하는 것은?","options":["휴머노이드 60.3만대 판매","산업용 로봇 전체 신규 설치","리얼월드 고객 로봇 수","모든 서비스 로봇 판매"],"answer":1,"explain":"IFR의 산업용 로봇 설치 통계로 범용 휴머노이드 판매량과 혼동하면 안 된다.","source":"ifrobot"},{"question":"수집 데이터의 가장 좋은 최종 품질 검증은?","options":["파일 수가 증가","비디오가 4K","실제 모델 downstream 성능의 통제된 향상","데이터가 희소해 보임"],"answer":2,"explain":"정확성과 유효성을 따로 검증하고 ablation으로 모델 효과를 확인해야 한다.","source":"rldx"},{"question":"3D Gaussian Splatting이 직접 제공하지 않는 것은?","options":["장면 표현","신시점 렌더링","다중뷰 복원 지원","실측 손가락 접촉력"],"answer":3,"explain":"3DGS는 장면 표현 방법이며 힘 계측은 별도 센서 또는 추정 모델이 필요하다.","source":"rldx"},{"question":"Retargeting에서 가장 중요한 목표는?","options":["사람 관절각의 숫자 그대로 복사","로봇의 물리 제한 내에서 작업 의도와 접촉을 보존","프레임 수 늘리기","VLM 텍스트 길이 늘리기"],"answer":1,"explain":"같은 사람 관절각을 다른 로봇에 복제해도 물체와의 상호작용이 달라진다.","source":"huro"},{"question":"사업적으로 데이터 플라이휠이 성립하는 조건은?","options":["저장 용량만 증가","고객사 데이터가 다음 고객 적응 비용 감소에 기여","모든 데이터 독점","수집 인력의 무한 증원"],"answer":1,"explain":"교차 고객 재사용, 학습 기여도, 배포 경제성 개선이 함께 필요하다.","source":"dn26"},{"question":"2026년 모델 사용 정책으로 확인되는 것은?","options":["코드와 가중치 모두 완전 무료 상업 가능","코드 Apache 2.0, 모델 가중치 별도 비상업 라이선스","기업 매출 수십억원 확정","코드 공개 없음"],"answer":1,"explain":"공식 GitHub는 코드와 체크포인트의 라이선스를 구분한다.","source":"rldxrepo"},{"question":"현장 작업 KPI 중 빠질 수 없는 것은?","options":["성공률만","연구 모델 크기만","작업 완료량·개입·재시도·안전 비용","문서 페이지 수"],"answer":2,"explain":"단일 시도 성공률이 높아도 작업 처리량과 인간 개입 비용 때문에 경제성이 나쁠 수 있다.","source":"ed26"},{"question":"HuRo의 핵심 기여는?","options":["영상만 많이 저장","인간 영상에서 로봇 정렬 관측·행동 생성","로봇 하드웨어 직접 제조","힘 센서 없이 실제 토크 확정"],"answer":1,"explain":"사람 비디오의 pose·action retarget과 visual robotization을 함께 수행한다.","source":"huro"},{"question":"HOPE를 읽을 때 가장 조심할 것은?","options":["압력 예측=실측 압력이라고 보기","RGB 비디오 사용","MANO mesh 표현","time series 사용"],"answer":0,"explain":"추정 신호는 센서 계측과 정확도·불확실성 면에서 다르다.","source":"hope"},{"question":"AutoDex의 차별점은?","options":["시뮬레이션만 수행","실제 파지 시도·성공 실패의 자동 물리 검증","로봇 관절 미사용","대규모 텍스트 생성"],"answer":1,"explain":"후보 생성에서 실물 실행·라벨·리셋까지 자동 루프를 만든다.","source":"autodex"},{"question":"플랫폼 진입장벽을 더 잘 설명하는 것은?","options":["일반 CSV 변환 코드","고객 운영에 연결된 재학습·배포·검증과 호환성","로고 디자인","정적 웹페이지"],"answer":1,"explain":"기능 코드 한 조각보다 복잡한 현장 운영의 통합과 전환 비용이 중요하다.","source":"aws"},{"question":"리얼월드의 일본 전략에서 주목할 시장은?","options":["관광객 수만","현장 위치를 옮기기 어려운 서비스·물류","해상 석유 채굴만","GPU 반도체 단독 제조"],"answer":1,"explain":"류 대표는 호텔·편의점·물류처럼 현장이 소비자와 맞닿은 서비스를 예로 들었다.","source":"dn26"},{"question":"대표 면접에서 더 좋은 답변은?","options":["데이터가 언제나 모든 것보다 중요","모델·데이터·하드웨어 중 중요도가 작업별 병목에 따라 달라짐","엔비디아는 아무것도 못함","모든 로봇은 1년 내 대체"],"answer":1,"explain":"조건을 나누고 반론을 다루는 기술적 판단이 단순 동조보다 설득력 있다.","source":"dn26"},{"question":"RLDX-2 일정에 대해 확인된 것은?","options":["2027년 1월 출시 확정","2027년 상반기 공개 가능성이 보도됨","이미 2026년 7월 상용 완료","로드맵 전혀 없음"],"answer":1,"explain":"9월 목표 발표와 10월 CPO의 상반기 전망을 구분해야 한다.","source":"ed26"}],"interview":[{"question":"왜 리얼월드이고, 왜 로봇인가?","intent":"기술 동기와 사업 방향을 얼마나 정확히 이해하는가","points":"기존 자동화의 한계→정밀 조작→고품질 사람 데이터→직무 연결. 개인 경험 하나로 뒷받침. :"고객별 데이터/통합 비용이 줄지 않으면 SI화. 새 고객 도입 원가와 재사용률로 검증.","challenge":"그래서 당장 무엇부터 측정할 건가?"},{"question":"입사 90일 동안 무엇을 할 건가?","intent":"실행 우선순위","points":"1~30일 데이터 흐름·병목/QA 정의, 31~60일 작은 자동화·관측성, 61~90일 품질/학습 개선 검증.","challenge":"조직의 실제 우선순위가 다르면?"},{"question":"대표에게 묻고 싶은 것은?","intent":"무엇을 알고 싶어 하는가","points":"현재 가장 큰 데이터 병목, 1년 기술적 성공 기준, 고객별 재사용 비용에 대한 질문.","challenge":"답변을 들은 뒤 어떤 후속 질문을 할까?"}]};
const STORE='rlwrld_interview_study_2026_v3';
const LESSON_COUNT=DATA.lessons.reduce((a,l)=>a+l.cards.length,0);
const NAV=[['home','⌂','대시보드'],['learn','◈','한 장씩 학습'],['align','⊙','대표와 생각 정렬'],['evidence','◷','류중희 발언 검증'],['papers','▤','핵심 논문'],['glossary','♧','용어 사전'],['interview','♬','대표 면접 연습'],['quiz','◇','이해도 확인'],['sources','↗','원문 자료실']];
function lsGet(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}}
const saved=lsGet();
let st={view:'home',focus:false,drawer:false,light:saved.light||false,size:saved.size||1,li:saved.li||0,ci:saved.ci||0,tab:'gist',ev:0,paper:null,sourceFilter:'전체',pfilter:'전체',termFilter:'전체',termSearch:'',paperSearch:'',quizIdx:0,interviewIdx:0,showInterview:false,showOutline:false,read:saved.read||{},star:saved.star||{},notes:saved.notes||{},answers:saved.answers||{},quizAnswers:saved.quizAnswers||{},alignmentIdx:0,alignChoices:saved.alignChoices||{},alignNotes:saved.alignNotes||{},...{}};
function store(){try{localStorage.setItem(STORE,JSON.stringify({light:st.light,size:st.size,li:st.li,ci:st.ci,read:st.read,star:st.star,notes:st.notes,answers:st.answers,quizAnswers:st.quizAnswers,alignChoices:st.alignChoices,alignNotes:st.alignNotes}))}catch(e){}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function srcLinks(ids){return [...new Set(ids||[])].filter(x=>DATA.sources[x]).map(k=>{const s=DATA.sources[k];return `<a class="srcchip" target="_blank" rel="noopener noreferrer" href="${esc(s.url)}" title="${esc(s.kind)} | ${esc(s.note)}">↗ ${esc(s.title.split(' — ')[0])} · ${esc(s.date)}</a>`}).join('')}
function pageTitle(eyebrow,title,sub){return `<div class="hero"><div class="eyebrow">${eyebrow}</div><h2 style="margin-top:10px">${title}</h2>${sub?`<p class="muted" style="margin-top:9px;max-width:780px">${sub}</p>`:''}</div>`}
function btn(txt,action,extra='',cls=''){return `<button class="btn ${cls}" data-action="${action}" ${extra}>${txt}</button>`}
function readCount(){return Object.keys(st.read).filter(k=>st.read[k]).length}
function percent(){return Math.round(readCount()/LESSON_COUNT*100)}
function curKey(){return `${st.li}:${st.ci}`}
function chapterRead(i){return DATA.lessons[i].cards.filter((c,j)=>st.read[`${i}:${j}`]).length}

<div class="box inner spotlight"><div class="eyebrow">권장 읽기 순서</div><p style="margin-top:8px"><strong>RLDX-1 → HuRo → HOPE → PointWAM → AutoDex</strong>부터 읽으세요. 그 다음 UMI/DexUMI, Open X, π₀, DAgger가 이 다섯 연구를 이해하는 데 도움이 됩니다.</p>${btn('5편만 보기','priorityP','','tinybtn')}</div>
<div class="filterbar"><div class="search"><input aria-label="논문 검색" id="paperSearch" data-search="paperSearch" value="${esc(st.paperSearch)}" placeholder="논문명·기술 키워드 검색"/></div>${['전체','RLWRLD','핵심 선행연구','먼저 읽기'].map(x=>`<button data-action="pfilter" data-value="${esc(x)}" class="chip ${st.pfilter===x?'active':''}">${x}</button>`).join('')}</div>
<div class="two papersplit" style="align-items:start;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr)"><div class="paperlist">${p.length?p.map(x=>`<button class="paper ${picked&&x.id===picked.id?'active':''}" data-action="paper" data-id="${x.id}"><div><span class="tag ${x.priority===1?'mint':''}">${x.group==='RLWRLD'?'리얼월드 연구':'선행연구'}</span> <span class="tag">${x.year}</span><div class="pname" style="margin-top:9px">${esc(x.name)}</div><div class="pidea">${esc(x.idea)}</div></div></button>`).join(''):'<div class="empty">일치하는 논문이 없어요. 검색어를 줄여보세요.</div>'}</div>
<div class="paperdetailside">${picked?`<div class="box inner paperdetail" style="position:sticky;top:85px;margin-top:0"><div class="eyebrow">${picked.group} · ${picked.year}</div><h2 style="font-size:22px;margin:9px 0">${esc(picked.name)}</h2><div class="divider"></div>
<h3>① 핵심 질문</h3><p class="answer">${esc(picked.idea)}</p><h3>② 어떻게 해결했나</h3><p class="answer">${esc(picked.method)}</p><h3>③ 무엇을 보여줬나</h3><p class="answer">${esc(picked.result)}</p><div class="pointbox" style="margin-top:16px"><strong style="color:var(--gold)">④ 한계와 주의점</strong><p class="answer" style="margin-top:9px">${esc(picked.caveat)}</p></div>
<div class="pointbox interview" style="margin-top:12px"><strong style="color:var(--accent)">⑤ Hand Data Pipeline과 연결</strong><p class="answer" style="margin-top:9px">${esc(picked.job)}</p></div><div class="cta"><a class="btn main" href="${esc(picked.url)}" target="_blank" rel="noopener noreferrer">↗ 원문·논문 열기</a></div></div>`:'<div class="empty">논문을 선택해보세요.</div>'}</div></div>`}
function renderGlossary(){const cats=['전체',...new Set(DATA.glossary.map(x=>x.cat))];const list=DATA.glossary.filter(t=>(st.termFilter==='전체'||t.cat===st.termFilter)&&[t.title,t.definition,t.trap].join(' ').toLowerCase().includes(st.termSearch.toLowerCase()));return `${pageTitle('TERMS, WITHOUT JARGON','주요 용어 · 쉬운 정의와 함정','용어를 외우는 게 목표가 아니에요. 기술의 정확한 의미와 면접에서 오해하기 쉬운 부분을 구분하는 게 목표입니다.')}
<div class="filterbar"><div class="search"><input id="termSearch" data-search="termSearch" value="${esc(st.termSearch)}" placeholder="예: retargeting, contact, data moat" aria-label="용어 검색"/></div>${cats.map(x=>`<button class="chip ${st.termFilter===x?'active':''}" data-action="termFilter" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div><p class="muted small" style="margin-bottom:15px">${list.length}개 용어 · 자세히 읽고 싶은 항목만 열어보세요.</p>
<div class="glossarygrid">${list.length?list.map(t=>`<div class="term"><span class="tag" style="margin-bottom:9px">${esc(t.cat)}</span><h3>${esc(t.title)}</h3><div class="def">${esc(t.definition)}</div><details><summary class="tip" style="cursor:pointer;margin-top:9px">오해하기 쉬운 점 보기 ▾</summary><div class="trap">⚠ ${esc(t.trap)}</div></details></div>`).join(''):'<div class="empty">검색 결과가 없어요. 다른 단어로 검색해 보세요.</div>'}</div>`}
function renderInterview(){const x=DATA.interview[st.interviewIdx];return `${pageTitle('CEO FINAL INTERVIEW','대표 면접 모의 연습','실제 기출 문제가 아니라 공개 전략에 근거한 예상 질문입니다. 자기 경험과 생각에 맞게 말하세요.')}
<div class="box inner spotlight"><div class="eyebrow">질문 ${st.interviewIdx+1} / ${DATA.interview.length}</div><div class="progress" style="margin-top:10px"><b style="width:${Math.round((st.interviewIdx+1)/DATA.interview.length*100)}%"></b></div><h2 class="question" style="margin:20px 0">${esc(x.question)}</h2><p class="muted small">실제 면접처럼 먼저 30~90초간 소리 내어 답해보세요. 그 다음 평가 의도를 펼쳐보세요.</p>
<div class="cardnotes" style="margin-top:19px"><label class="eyebrow" for="myAnswer">내 답변 초안</label><textarea id="myAnswer" data-answer="${st.interviewIdx}" rows="6" placeholder="제가 이해한 산업의 변화는... 제 프로젝트에서는... 그래서 리얼월드에서...">${esc(st.answers[st.interviewIdx]||'')}</textarea><span class="tiny muted">자동 저장됩니다. 내 실제 경험을 반영하세요.</span></div>
<div class="cta">${btn(st.showInterview?'해설 접기':'평가 포인트와 추가 질문 열기','toggleInterview','','main')}</div>
${st.showInterview?`<div class="pointbox interview" style="margin-top:17px"><strong style="color:var(--accent)">평가하려는 부분</strong><p style="margin-top:9px">${esc(x.intent)}</p><div class="divider"></div><strong>답변 구성 힌트</strong><p style="margin-top:9px">${esc(x.points)}</p><div class="divider"></div><strong style="color:var(--gold)">꼬리 질문</strong><p style="margin-top:9px">${esc(x.challenge)}</p></div>`:''}
<div class="navbottom">${btn('← 이전 질문','prevInterview',st.interviewIdx===0?'disabled':'')}${btn('다음 질문 →','nextInterview',st.interviewIdx===DATA.interview.length-1?'disabled':'','main')}</div></div>`}
function quizStats(){const answered=Object.keys(st.quizAnswers).length;const correct=Object.entries(st.quizAnswers).filter(([i,n])=>DATA.quiz[+i]&&DATA.quiz[+i].answer===n).length;return {answered,correct}}
function renderQuiz(){const q=DATA.quiz[st.quizIdx];const a=st.quizAnswers[st.quizIdx],has=a!==undefined,{answered,correct}=quizStats();return `${pageTitle('TEST YOUR UNDERSTANDING','개념 이해도 셀프 체크','16개 문제 · 틀려도 괜찮아요. 틀린 이유를 이해하고 다시 읽어보면 충분합니다.')}
<div class="box inner"><div class="study-kicker"><div class="eyebrow">QUESTION ${st.quizIdx+1} / ${DATA.quiz.length}</div><span class="tag mint">${answered}문제 답함 · ${correct}문제 정답</span></div><div class="progress" style="margin:15px 0 23px"><b style="width:${Math.round((st.quizIdx+1)/DATA.quiz.length*100)}%"></b></div><h2 class="question">${esc(q.question)}</h2><div class="options">${q.options.map((x,i)=>`<button class="option ${has?(i===q.answer?'correct':i===a?'wrong':''):''}" data-action="choose" data-idx="${i}" ${has?'disabled':''}><span class="small faint">${String.fromCharCode(65+i)}.</span> ${esc(x)} ${has&&i===q.answer?' ✓':''}</button>`).join('')}</div>
${has?`<div class="quizanswer"><strong style="color:${a===q.answer?'var(--green)':'var(--gold)'}">${a===q.answer?'✓ 잘 이해했어요':'↺ 다시 생각해볼 수 있어요'}</strong><p style="margin-top:7px">${esc(q.explain)}</p>${srcLinks([q.source])}</div>`:''}
<div class="navbottom">${btn('← 이전 문제','prevQuiz',st.quizIdx===0?'disabled':'')}${btn(st.quizIdx===DATA.quiz.length-1?'다시 1번':'다음 문제 →',st.quizIdx===DATA.quiz.length-1?'firstQuiz':'nextQuiz','','main')}</div></div><div class="cta">${btn('퀴즈 답변 전체 초기화','resetQuiz','','ghost')}</div>`}
function renderSources(){const groups=['전체',...new Set(Object.values(DATA.sources).map(x=>x.kind))];const entries=Object.entries(DATA.sources).filter(([k,s])=>st.sourceFilter==='전체'||s.kind===st.sourceFilter);return `${pageTitle('SOURCE ROOM','인용 출처와 검증 수준','각 개념 카드마다 원문 링크가 달려 있습니다. 기업의 목표·자체 연구 성과와 독립적으로 검증된 산업 지표는 다르게 읽어야 합니다.')}
<div class="box inner spotlight"><div class="eyebrow">정확도를 지키는 세 가지 규칙</div><p style="margin-top:8px">① 류중희 직접 발언인가, 임원·회사 발표인가? ② 연구실 벤치마크인가, 고객 현장 실운영인가? ③ 계획·협약(MOU)인가, 실제 계약·반복 매출인가?</p></div><div class="filterbar">${groups.map(x=>`<button class="chip ${x===st.sourceFilter?'active':''}" data-action="sourceFilter" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div>
<div class="source-list">${entries.map(([k,s])=>`<div class="source-item"><div class="toolbar-row"><span class="tag mint">${esc(s.kind)}</span><span class="sdate">${esc(s.date)}</span></div><div class="sname">${esc(s.title)}</div><p class="snote">${esc(s.note)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="small" style="display:inline-block;margin-top:8px">원문 열기 ↗</a></div>`).join('')}</div>
<div class="section-head"><h2>학습 기록과 내 답변</h2></div><div class="box inner"><p class="muted small">진도와 메모는 현재 브라우저의 로컬 저장소에만 보관합니다. HTML 파일 자체에 기록되는 것이 아니므로 브라우저 데이터가 지워지면 사라질 수 있어요.</p><div class="cta">${btn('내 기록 백업 파일(.json) 만들기','export','','main')}${btn('백업 복원하기','import')}<input type="file" id="importFile" accept="application/json" style="display:none"/></div><p class="tiny faint">민감한 개인정보를 답변 메모에 적지 않는 것을 권장합니다.</p></div>`}
function renderBody(){if(st.view==='home')return renderHome();if(st.view==='learn')return renderLearn();if(st.view==='align')return renderAlign();if(st.view==='evidence')return renderEvidence();if(st.view==='papers')return renderPapers();if(st.view==='glossary')return renderGlossary();if(st.view==='interview')return renderInterview();if(st.view==='quiz')return renderQuiz();return renderSources()}
function render(scroll=false){document.body.classList.toggle('light',st.light);document.body.classList.toggle('focus-on',st.focus);document.documentElement.style.setProperty('--font',`${17+(st.size-1)*2}px`);document.getElementById('app').innerHTML=`${renderSidebar()}<div class="mobilemask ${st.drawer?'show':''}" data-action="closeDrawer"></div><div class="shell">${renderTop()}<main class="content" id="main">${renderBody()}</main></div>`;if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function nav(view){st.view=view;st.drawer=false;store();render(true)}
function setCard(li,ci){st.li=Math.max(0,Math.min(li,DATA.lessons.length-1));st.ci=Math.max(0,Math.min(ci,DATA.lessons[st.li].cards.length-1));st.tab='gist';store();nav('learn')}
function moveCard(step){let li=st.li,ci=st.ci+step;if(ci>=DATA.lessons[li].cards.length){li=Math.min(li+1,DATA.lessons.length-1);ci=li===st.li?st.ci:0}if(ci<0){li=Math.max(li-1,0);ci=li===st.li?0:DATA.lessons[li].cards.length-1}setCard(li,ci)}
function action(el){const a=el.dataset.action;const idx=+(el.dataset.idx||0);switch(a){
case 'nav':nav(el.dataset.view);break;case 'drawer':st.drawer=!st.drawer;render();break;case 'closeDrawer':st.drawer=false;render();break;case 'resume':nav('learn');break;case 'quickE':nav('evidence');break;case 'quickA':nav('align');break;case 'quickP':nav('papers');break;case 'quickI':nav('interview');break;case 'startVision':case 'routeVision':setCard(0,0);break;case 'routePipeline':setCard(7,0);break;
case 'chapter':setCard(idx,0);break;case 'card':setCard(st.li,idx);break;case 'tab':st.tab=el.dataset.tab;render();break;case 'nextTab':st.tab=({gist:'deep',deep:'crit',crit:'apply',apply:'gist'})[st.tab];render();break;case 'backTab':st.tab='gist';render();break;case 'prevCard':moveCard(-1);break;case 'nextCard':moveCard(1);break;case 'star':st.star[curKey()]=!st.star[curKey()];store();render();break;case 'complete':st.read[curKey()]=!st.read[curKey()];store();render();break;
case 'prevAlign':st.alignmentIdx=Math.max(0,st.alignmentIdx-1);render();break;case 'nextAlign':st.alignmentIdx=Math.min(DATA.alignment.length-1,st.alignmentIdx+1);render();break;case 'goAlign':st.alignmentIdx=idx;render();break;case 'alignChoice':st.alignChoices[st.alignmentIdx]=el.dataset.value;store();render();break;case 'evidence':st.ev=idx;render();document.querySelector('.evidence-detail')?.scrollIntoView({behavior:'smooth',block:'start'});break;case 'prevEv':st.ev=Math.max(0,st.ev-1);render();break;case 'nextEv':st.ev=Math.min(DATA.evidence.length-1,st.ev+1);render();break;
case 'pfilter':st.pfilter=el.dataset.value;st.paper=null;render();break;case 'priorityP':st.pfilter='먼저 읽기';st.paper=null;render();break;case 'paper':st.paper=el.dataset.id;render();break;
case 'termFilter':st.termFilter=el.dataset.value;render();break;case 'sourceFilter':st.sourceFilter=el.dataset.value;render();break;
case 'toggleInterview':st.showInterview=!st.showInterview;render();break;case 'prevInterview':st.interviewIdx=Math.max(0,st.interviewIdx-1);st.showInterview=false;render();break;case 'nextInterview':st.interviewIdx=Math.min(DATA.interview.length-1,st.interviewIdx+1);st.showInterview=false;render();break;
case 'choose':if(st.quizAnswers[st.quizIdx]===undefined){st.quizAnswers[st.quizIdx]=idx;store();render()}break;case 'prevQuiz':st.quizIdx=Math.max(0,st.quizIdx-1);render();break;case 'nextQuiz':st.quizIdx=Math.min(DATA.quiz.length-1,st.quizIdx+1);render();break;case 'firstQuiz':st.quizIdx=0;render();break;case 'resetQuiz':if(confirm('퀴즈 답변을 모두 초기화할까요?')){st.quizAnswers={};st.quizIdx=0;store();render()}break;
case 'theme':st.light=!st.light;store();render();break;case 'focus':st.focus=!st.focus;render();break;case 'bigger':st.size=Math.min(3,st.size+1);store();render();break;case 'smaller':st.size=Math.max(0,st.size-1);store();render();break;case 'sizeCycle':st.size=st.size>=3?0:st.size+1;store();render();break;
case 'export':{let blob=new Blob([JSON.stringify({created:new Date().toISOString(),read:st.read,star:st.star,notes:st.notes,answers:st.answers,quizAnswers:st.quizAnswers,alignChoices:st.alignChoices,alignNotes:st.alignNotes,li:st.li,ci:st.ci},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob);let link=document.createElement('a');link.href=u;link.download='rlwrld_study_backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
case 'import':document.getElementById('importFile')?.click();break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note!==undefined){st.notes[t.dataset.note]=t.value;store();return}if(t.dataset.answer!==undefined){st.answers[t.dataset.answer]=t.value;store();return}if(t.dataset.alignnote!==undefined){st.alignNotes[t.dataset.alignnote]=t.value;store();return}if(t.dataset.search){const pos=t.selectionStart,key=t.dataset.search;st[key]=t.value;render();const n=document.getElementById(t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}return}});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d||typeof d!=='object')throw Error('invalid');for(const k of ['read','star','notes','answers','quizAnswers','alignChoices','alignNotes'])if(d[k]&&typeof d[k]==='object')st[k]=d[k];if(Number.isInteger(d.li)&&d.li>=0&&d.li<DATA.lessons.length)st.li=d.li;if(Number.isInteger(d.ci))st.ci=Math.min(d.ci,DATA.lessons[st.li].cards.length-1);store();render();alert('학습 기록을 복원했습니다.')}catch(x){alert('올바른 학습 기록 파일인지 확인해주세요.')}});
document.addEventListener('keydown',e=>{if(st.view!=='learn'||e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target;if(['INPUT','TEXTAREA','SELECT'].includes(t.tagName)||t.isContentEditable)return;if(e.key==='ArrowLeft'){e.preventDefault();moveCard(-1)}else if(e.key==='ArrowRight'){e.preventDefault();moveCard(1)}});
render();
</script></body></html>
